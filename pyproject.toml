[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "lark-oapi>=1.4.0",
    "python-frontmatter>=1.3.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
]

# 控制台命令：pip install -e . 后生成 zero.exe / zero-permission.exe，任意目录可用
[project.scripts]
zero = "zero.main:main"
zero-permission = "zero.permission.envelope:main"

# 单一 stable 顶层包 zero/，内部子模块随包自动发现，
# 结构性改动（增删/重命名子模块）不再需要重装，避免 editable MAPPING 过期。
[tool.setuptools]
packages = [
    "zero",
    "zero.bus",
    "zero.channels",
    "zero.core",
    "zero.maintenance",
    "zero.permission",
    "zero.providers",
    "zero.scheduler",
    "zero.session",
    "zero.tools",
    "zero.utils",
]