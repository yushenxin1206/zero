[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "lark-oapi>=1.4.0",
    "python-frontmatter>=1.3.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
]

# 控制台命令：pip install -e . 后生成 zero.exe，任意目录可用
[project.scripts]
zero = "main:main"

# 扁平布局，显式声明包与顶层模块，避免 setuptools 自动发现
# 把 tests/docs/skills 等非包目录卷进来
[tool.setuptools]
packages = [
    "bus",
    "channels",
    "core",
    "providers",
    "scheduler",
    "session",
    "tools",
    "utils",
]
py-modules = ["main", "config", "datacls"]