<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zero</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #10161d;
    --panel-2: #141c25;
    --line: #1f2a36;
    --text: #dbe6f2;
    --muted: #7f91a5;
    --accent: #3ddc97;
    --accent-dim: #1f6f52;
    --blue: #66aaff;
    --yellow: #f2c14e;
    --red: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #10202b 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  button {
    font: inherit; color: inherit; cursor: pointer;
    background: transparent; border: 1px solid var(--line);
    border-radius: 9px; padding: 6px 12px;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: #2c3b4c; }
  button:disabled { opacity: .45; cursor: default; }
  #app { display: flex; height: 100%; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 268px; flex: 0 0 268px; display: flex; flex-direction: column;
    background: rgba(14, 20, 27, .86); border-right: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    padding: 18px 18px 12px; font-size: 16px; font-weight: 600; letter-spacing: .3px;
  }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
  }
  .brand .tag {
    font-size: 11px; font-weight: 500; color: var(--accent);
    border: 1px solid var(--accent-dim); border-radius: 999px; padding: 1px 8px;
  }
  #new-session { margin: 0 14px 12px; text-align: left; color: var(--accent); }
  .section-label {
    padding: 6px 18px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .session {
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .session:hover { background: var(--panel-2); }
  .session.active { background: #12261f; border-color: var(--accent-dim); }
  .session .t {
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session .m { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sidebar-footer {
    border-top: 1px solid var(--line); padding: 12px 18px;
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }
  .conn-dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .conn-dot.off { background: var(--red); }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px; border-bottom: 1px solid var(--line);
    background: rgba(11, 15, 20, .6); backdrop-filter: blur(8px);
  }
  #session-title { font-size: 15px; font-weight: 600; }
  #session-sub { font-size: 11px; color: var(--muted); }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .model-badge { color: var(--blue); border-color: #223850; font-size: 12px; }
  #messages {
    flex: 1; overflow-y: auto; padding: 26px 28px 10px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 12px; max-width: 900px; margin: 0 auto 18px; }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; margin-top: 2px;
    background: #16232e; color: var(--accent); border: 1px solid var(--line);
  }
  .bubble {
    min-width: 0; max-width: 100%; padding: 12px 16px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: #12261f; border-color: var(--accent-dim); white-space: pre-wrap;
  }
  .msg.error .bubble { border-color: #5a2b2b; background: #1d1113; }
  .muted { color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 8px 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 8px; line-height: 1.35; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 15px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md blockquote {
    margin: 8px 0; padding: 4px 12px; color: #b7c6d6;
    border-left: 3px solid var(--accent-dim); background: #0e1a18;
  }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .md code {
    font: 12.5px/1.5 Consolas, "Cascadia Code", monospace;
    background: #0a1118; border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 5px; color: #b9e6ff;
  }
  .codeblock { margin: 10px 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .code-lang {
    padding: 4px 10px; font-size: 11px; color: var(--muted);
    background: #0c141c; border-bottom: 1px solid var(--line);
  }
  .codeblock pre {
    margin: 0; padding: 11px 13px; overflow-x: auto; background: #090f15;
  }
  .codeblock code {
    background: none; border: none; padding: 0; color: #cfe7ff;
    font: 12.5px/1.55 Consolas, "Cascadia Code", monospace;
  }
  .table-wrap { overflow-x: auto; margin: 10px 0; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  th { background: #0e1720; }
  a { color: var(--blue); }

  .tool-chip {
    display: flex; gap: 8px; align-items: flex-start;
    margin: 7px 0; padding: 6px 10px; font-size: 12px; color: var(--muted);
    background: #0c141c; border: 1px dashed #26384a; border-radius: 8px;
    font-family: Consolas, "Cascadia Code", monospace;
  }
  .tool-chip .gear { color: var(--blue); }
  .reasoning {
    margin: 0 0 8px; padding: 6px 10px; font-size: 12px;
    color: var(--muted); background: #0b1218; border: 1px solid var(--line);
    border-radius: 8px;
  }
  .reasoning summary { cursor: pointer; color: #93a7bb; }
  .reasoning pre {
    margin: 6px 0 0; max-height: 190px; overflow: auto; white-space: pre-wrap;
    font: 12px/1.6 Consolas, "Cascadia Code", monospace; color: #8ea1b5;
  }
  .marker { margin: 8px 0 0; font-size: 12px; color: var(--yellow); }
  .usage { margin: 8px 0 0; font-size: 11px; color: #5f7082; }
  .approval {
    margin: 10px 0 2px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #5c4a1f; background: #1a1710;
  }
  .approval.ok { border-color: var(--accent-dim); background: #101b16; }
  .approval.no { border-color: #5a2b2b; background: #1a1113; }
  .approval-head { display: flex; gap: 8px; align-items: center; font-weight: 600; color: var(--yellow); }
  .approval.ok .approval-head { color: var(--accent); }
  .approval.no .approval-head { color: var(--red); }
  .approval-summary {
    margin: 8px 0 4px; padding: 8px 10px; border-radius: 7px;
    background: #0b1015; border: 1px solid var(--line);
    font-family: Consolas, "Cascadia Code", monospace; font-size: 12.5px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .approval-detail { font-size: 12px; color: var(--muted); }
  .approval-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .approval-btn { border-color: #4a3d1d; padding: 6px 12px; }
  .approval-btn .key {
    display: inline-block; margin-right: 6px; color: var(--yellow);
    font-family: Consolas, monospace; font-size: 12px;
  }
  .approval-foot { margin-top: 8px; font-size: 11px; color: var(--muted); }

  .subagent {
    margin: 10px 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #23364a; background: #0f1820;
  }
  .subagent .lbl { font-size: 11px; color: var(--blue); margin-bottom: 4px; }

  #empty {
    max-width: 640px; margin: 12vh auto 0; text-align: center; color: var(--muted);
  }
  #empty h1 { color: var(--text); font-size: 26px; margin-bottom: 6px; letter-spacing: .4px; }
  #empty .keys { margin-top: 18px; font-size: 12px; line-height: 2; }
  kbd {
    font: 11px Consolas, monospace; border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; background: var(--panel);
  }

  /* ---------- composer ---------- */
  #composer {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 14px 28px 20px; border-top: 1px solid var(--line);
    background: rgba(11, 15, 20, .7); backdrop-filter: blur(8px);
  }
  #input {
    flex: 1; resize: none; max-height: 200px; min-height: 44px;
    padding: 11px 14px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit; line-height: 1.5; outline: none;
  }
  #input:focus { border-color: #2f4a60; box-shadow: 0 0 0 3px rgba(61, 220, 151, .06); }
  #send { min-width: 72px; min-height: 44px; }
  #send:not(:disabled) { background: var(--accent); color: #06110c; border-color: var(--accent); font-weight: 600; }
  #send:not(:disabled):hover { background: #4ae8a6; }
  #stop { min-height: 44px; color: var(--red); border-color: #5a2b2b; }

  .hidden { display: none !important; }

  /* ---------- modal / toast ---------- */
  #modal {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  .modal-box {
    width: min(620px, 88vw); max-height: 72vh; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
    display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600;
  }
  .modal-body { padding: 14px 18px; overflow-y: auto; }
  .model-item {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
    margin-bottom: 8px; cursor: pointer;
  }
  .model-item:hover { background: var(--panel-2); }
  .model-item.active { border-color: var(--accent-dim); background: #12261f; }
  .model-item .cur { font-size: 11px; color: var(--accent); }
  .task-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .task-item:last-child { border-bottom: none; }
  .task-meta { font-size: 11px; color: var(--muted); }
  .task-text { font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
  #toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    z-index: 30; pointer-events: none;
  }
  .toast-item {
    padding: 7px 14px; border-radius: 999px; font-size: 12.5px;
    background: #16222d; border: 1px solid var(--line); color: var(--text);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35); animation: pop .18s ease-out;
  }
  .toast-item.error { border-color: #5a2b2b; color: #ffb4b4; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="dot"></span>zero<span class="tag">web</span></div>
    <button id="new-session">＋ 新建会话</button>
    <div class="section-label">会话</div>
    <div id="sessions"></div>
    <div class="sidebar-footer">
      <span id="conn-dot" class="conn-dot"></span>
      <span id="conn-text">连接中…</span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div>
        <div id="session-title">新会话</div>
        <div id="session-sub"></div>
      </div>
      <div class="top-actions">
        <button id="tasks-btn">定时任务</button>
        <button id="model-btn" class="model-badge">model</button>
      </div>
    </header>

    <div id="messages">
      <div id="empty">
        <h1>zero</h1>
        <div>本地桌面 AI 助手 · Web 通道</div>
        <div class="keys">
          <div><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · <kbd>Esc</kbd> 终止当前回复</div>
        </div>
      </div>
    </div>

    <div id="composer">
      <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
      <button id="stop" class="hidden">停止</button>
      <button id="send">发送</button>
    </div>
  </main>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title"></span><button id="modal-close">关闭</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = (sel) => document.querySelector(sel);
  const state = {
    ws: null,
    token: "",
    wsUrl: "",
    session: null,
    sessions: [],
    model: "",
    models: [],
    historySession: "",
    busy: false,
    awaiting: false,
    activeTurnId: "",
    active: null,
    doneTurns: new Set(),
    connecting: false,
  };

  /* ---------------- utilities ---------------- */

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function clip(text, n) {
    const s = String(text || "");
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function el(tag, cls) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    return node;
  }

  /* ---------------- markdown ---------------- */

  function inlineMd(raw) {
    const codeSpans = [];
    let s = escapeHtml(raw).replace(/`([^`\n]+)`/g, (_, code) => {
      codeSpans.push(`<code>${code}</code>`);
      return `\u0001${codeSpans.length - 1}\u0001`;
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    s = s.replace(/\u0001(\d+)\u0001/g, (_, i) => codeSpans[+i]);
    return s.replace(/\n/g, "<br>");
  }

  function tableCells(line) {
    let s = line.trim();
    if (s.startsWith("|")) s = s.slice(1);
    if (s.endsWith("|")) s = s.slice(0, -1);
    return s.split("|").map((c) => c.trim());
  }

  function isTableSep(line) {
    const cells = tableCells(line);
    return cells.length > 0 && cells.every((c) => /^:?-{3,}:?$/.test(c));
  }

  function renderMarkdown(src) {
    if (!src) return "";
    const blocks = [];
    let body = String(src).replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g,
      (_, lang, code) => {
        const label = lang.trim();
        blocks.push(
          `<div class="codeblock">${label
            ? `<div class="code-lang">${escapeHtml(label)}</div>` : ""}` +
          `<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre></div>`);
        return `\n\u0000${blocks.length - 1}\u0000\n`;
      });

    const lines = body.split("\n");
    const html = [];
    let para = [];
    let list = null;
    let i = 0;

    const flushPara = () => {
      if (!para.length) return;
      html.push(`<p>${para.map(inlineMd).join("<br>")}</p>`);
      para = [];
    };
    const flushList = () => {
      if (!list) return;
      html.push(`<${list.tag}>${list.items
        .map((item) => `<li>${inlineMd(item)}</li>`).join("")}</${list.tag}>`);
      list = null;
    };

    while (i < lines.length) {
      const line = lines[i];
      const ph = line.match(/^\u0000(\d+)\u0000$/);
      if (ph) { flushPara(); flushList(); html.push(blocks[+ph[1]]); i++; continue; }
      if (!line.trim()) { flushPara(); flushList(); i++; continue; }

      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        flushPara(); flushList();
        const lv = m[1].length;
        html.push(`<h${lv}>${inlineMd(m[2])}</h${lv}>`);
        i++; continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
        flushPara(); flushList(); html.push("<hr>"); i++; continue;
      }
      m = line.match(/^>\s?(.*)$/);
      if (m) {
        flushPara(); flushList();
        html.push(`<blockquote>${inlineMd(m[1])}</blockquote>`);
        i++; continue;
      }
      if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        flushPara(); flushList();
        const header = tableCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          rows.push(tableCells(lines[i]));
          i++;
        }
        html.push(
          `<div class="table-wrap"><table><thead><tr>${header
            .map((c) => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>` +
          rows.map((r) => `<tr>${r
            .map((c) => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("") +
          "</tbody></table></div>");
        continue;
      }
      m = line.match(/^\s*[-*+]\s+(.*)$/);
      if (m) {
        flushPara();
        if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; }
        list.items.push(m[1]); i++; continue;
      }
      m = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (m) {
        flushPara();
        if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; }
        list.items.push(m[1]); i++; continue;
      }
      if (list) {
        list.items[list.items.length - 1] += "\n" + line;
        i++; continue;
      }
      para.push(line);
      i++;
    }
    flushPara(); flushList();
    return html.join("\n");
  }

  /* ---------------- connection / bootstrap ---------------- */

  function setConn(text, cls) {
    $("#conn-text").textContent = text;
    const dot = $("#conn-dot");
    dot.className = "conn-dot" + (cls ? " " + cls : "");
  }

  function waitForPywebview(timeoutMs) {
    if (window.pywebview && window.pywebview.api) return Promise.resolve();
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      window.addEventListener("pywebviewready", finish, { once: true });
      const t0 = Date.now();
      const timer = setInterval(() => {
        if (window.pywebview && window.pywebview.api) {
          clearInterval(timer); finish();
        } else if (Date.now() - t0 > timeoutMs) {
          clearInterval(timer); finish();
        }
      }, 100);
    });
  }

  async function getBootstrap() {
    await waitForPywebview(8000);
    for (let i = 0; i < 120; i++) {
      try {
        const info = await window.pywebview.api.bootstrap();
        if (info && info.error) { setConn(info.error, "off"); return null; }
        if (info && info.ready && info.wsUrl) return info;
      } catch (err) { /* api not ready yet */ }
      await sleep(100);
    }
    setConn("后端未就绪（见 debug.log）", "off");
    return null;
  }

  function connect(info) {
    const url = info.wsUrl + "?token=" + encodeURIComponent(info.token);
    const ws = new WebSocket(url);
    state.ws = ws;
    state.token = info.token;
    state.wsUrl = info.wsUrl;

    ws.onopen = () => {
      state.connecting = false;
      setConn("已连接", "on");
    };
    ws.onmessage = (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch (err) { return; }
      handle(data);
    };
    ws.onclose = () => {
      setConn("连接断开，重试中…", "off");
      state.ws = null;
      if (!state.connecting) {
        state.connecting = true;
        setTimeout(() => {
          state.connecting = false;
          connect(info);
        }, 1000);
      }
    };
    ws.onerror = () => {};
  }

  function send(payload) {
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return false;
    state.ws.send(JSON.stringify(payload));
    return true;
  }

  /* ---------------- state / sessions ---------------- */

  function applyState(msg) {
    const previous = state.session ? state.session.id : "";
    state.session = msg.session || { id: "", title: "" };
    state.model = msg.model || "";
    state.models = msg.models || [];
    state.sessions = msg.sessions || [];
    $("#model-btn").textContent = state.model || "model";
    $("#session-title").textContent = state.session.title || "新会话";
    $("#session-sub").textContent = state.session.id
      ? "session " + state.session.id.slice(0, 8) : "";
    renderSessions();
    if (state.session.id && state.session.id !== previous
        && state.historySession !== state.session.id) {
      send({ type: "history", sessionId: state.session.id });
    }
  }

  function renderSessions() {
    const box = $("#sessions");
    box.innerHTML = "";
    if (!state.sessions.length) {
      const empty = el("div", "muted");
      empty.style.padding = "8px 10px";
      empty.textContent = "暂无会话";
      box.appendChild(empty);
      return;
    }
    const current = state.session ? state.session.id : "";
    state.sessions.forEach((s) => {
      const row = el("div", "session" + (s.id === current ? " active" : ""));
      const title = el("div", "t");
      title.textContent = s.title || "未命名会话";
      title.title = s.title || "";
      const meta = el("div", "m");
      meta.textContent = s.updatedAt || s.date || "";
      row.appendChild(title);
      row.appendChild(meta);
      row.onclick = () => selectSession(s.id);
      box.appendChild(row);
    });
  }

  function selectSession(id) {
    if (state.busy) { toast("当前回复未结束，稍后再切换", "info"); return; }
    if (id === state.session?.id) return;
    send({ type: "select", sessionId: id });
  }

  function requestSessions() {
    send({ type: "sessions" });
  }

  /* ---------------- message rendering ---------------- */

  function removeEmpty() {
    const empty = $("#empty");
    if (empty) empty.remove();
  }

  function scrollBottom(force) {
    const box = $("#messages");
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    if (force || near) box.scrollTop = box.scrollHeight;
  }

  function addUser(text) {
    removeEmpty();
    const row = el("div", "msg user");
    const bubble = el("div", "bubble");
    bubble.textContent = text;
    row.appendChild(bubble);
    $("#messages").appendChild(row);
    scrollBottom(true);
  }

  function addAssistantStatic(text) {
    removeEmpty();
    const row = el("div", "msg assistant");
    const avatar = el("div", "avatar");
    avatar.textContent = "z";
    const bubble = el("div", "bubble");
    const content = el("div", "md");
    content.innerHTML = renderMarkdown(text);
    bubble.appendChild(content);
    row.appendChild(avatar);
    row.appendChild(bubble);
    $("#messages").appendChild(row);
    scrollBottom(false);
  }

  function addCompact(text) {
    removeEmpty();
    const row = el("div", "msg");
    row.style.maxWidth = "900px";
    const note = el("div", "muted");
    note.style.fontSize = "12px";
    note.style.margin = "0 auto";
    note.textContent = "已压缩的历史上下文：" + clip(text, 600);
    row.appendChild(note);
    $("#messages").appendChild(row);
  }

  function addSubagentResult(text) {
    removeEmpty();
    const row = el("div", "msg assistant");
    const avatar = el("div", "avatar");
    avatar.textContent = "s";
    const bubble = el("div", "bubble");
    const card = el("div", "subagent");
    const label = el("div", "lbl");
    label.textContent = "子 agent 结果";
    const body = el("div", "md");
    body.innerHTML = renderMarkdown(text);
    card.appendChild(label);
    card.appendChild(body);
    bubble.appendChild(card);
    row.appendChild(avatar);
    row.appendChild(bubble);
    $("#messages").appendChild(row);
    scrollBottom(false);
  }

  function applyHistory(msg) {
    if (!state.session || msg.sessionId !== state.session.id) return;
    state.historySession = msg.sessionId;
    state.active = null;
    state.activeTurnId = "";
    state.awaiting = false;
    setBusy(false);

    const box = $("#messages");
    box.innerHTML = "";
    const messages = msg.messages || [];
    messages.forEach((m) => {
      if (m.compact) addCompact(m.content);
      else if (m.role === "user") addUser(m.content);
      else addAssistantStatic(m.content);
    });
    if (!messages.length) {
      box.innerHTML = emptyStateHtml();
    }
    box.scrollTop = box.scrollHeight;
  }

  function emptyStateHtml() {
    return `<div id="empty">
      <h1>zero</h1>
      <div>本地桌面 AI 助手 · Web 通道</div>
      <div class="keys">
        <div><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · <kbd>Esc</kbd> 终止当前回复</div>
      </div></div>`;
  }

  /* ---------------- active turn ---------------- */

  function createAssistantBubble(turnId) {
    removeEmpty();
    const row = el("div", "msg assistant");
    const avatar = el("div", "avatar");
    avatar.textContent = "z";
    const bubble = el("div", "bubble");
    const reasoning = el("details", "reasoning hidden");
    reasoning.innerHTML = "<summary></summary><pre></pre>";
    const parts = el("div", "parts");
    const extras = el("div", "extras");
    bubble.appendChild(reasoning);
    bubble.appendChild(parts);
    bubble.appendChild(extras);
    row.appendChild(avatar);
    row.appendChild(bubble);
    $("#messages").appendChild(row);

    return {
      turnId,
      row,
      bubble,
      reasoning,
      reasoningPre: reasoning.querySelector("pre"),
      reasoningSummary: reasoning.querySelector("summary"),
      reasoningText: "",
      autoCollapsed: false,
      parts,
      extras,
      items: [],
      renderTimer: 0,
      hasText() {
        return this.items.some((p) => p.type === "text" && p.text.trim());
      },
    };
  }

  function ensureActive(turnId) {
    if (state.active && (!turnId || state.active.turnId === turnId)) {
      return state.active;
    }
    if (state.active) finalize(state.active.turnId, {});
    state.active = createAssistantBubble(turnId || state.activeTurnId || "");
    return state.active;
  }

  function appendText(active, text) {
    const last = active.items[active.items.length - 1];
    if (last && last.type === "text") last.text += text;
    else active.items.push({ type: "text", text });
  }

  function scheduleRender(active) {
    if (active.renderTimer) return;
    active.renderTimer = setTimeout(() => {
      active.renderTimer = 0;
      renderParts(active);
    }, 60);
  }

  function renderParts(active) {
    active.parts.innerHTML = active.items.map((part) => {
      if (part.type === "text") {
        return `<div class="md">${renderMarkdown(part.text)}</div>`;
      }
      return `<div class="tool-chip"><span class="gear">⚙</span>` +
        `<span>${escapeHtml(clip(part.text, 240))}</span></div>`;
    }).join("");
  }

  function updateReasoning(active) {
    active.reasoning.classList.remove("hidden");
    active.reasoningPre.textContent = active.reasoningText;
    active.reasoningSummary.textContent =
      `思考过程 · ${active.reasoningText.length} 字`;
    if (!active.autoCollapsed) active.reasoning.open = true;
  }

  function collapseReasoning(active) {
    if (!active.reasoningText.trim() || active.autoCollapsed) return;
    active.autoCollapsed = true;
    active.reasoning.open = false;
    active.reasoningSummary.textContent =
      `💭 思考 ${active.reasoningText.trim().length} 字（已折叠）`;
  }

  function addError(active, text) {
    const box = el("div", "marker");
    box.style.color = "var(--red)";
    box.textContent = "错误：" + text;
    active.extras.appendChild(box);
  }

  function addMarker(active, text) {
    const box = el("div", "marker");
    box.textContent = text;
    active.extras.appendChild(box);
  }

  function addUsage(active, usage) {
    if (!usage) return;
    const box = el("div", "usage");
    box.textContent =
      `tokens: ${usage.promptTokens || 0} in / ${usage.completionTokens || 0} out / ` +
      `${usage.totalTokens || 0} total`;
    active.extras.appendChild(box);
  }

  function addApprovalCard(active, req) {
    collapseReasoning(active);
    const card = el("div", "approval");
    const head = el("div", "approval-head");
    head.innerHTML = `<span>⚠</span><span>${escapeHtml(req.title || "需要确认")}</span>`;
    const summary = el("div", "approval-summary");
    summary.textContent = req.summary || "";
    const actions = el("div", "approval-actions");
    const foot = el("div", "approval-foot");
    card.appendChild(head);
    card.appendChild(summary);
    if (req.detail) {
      const detail = el("div", "approval-detail");
      detail.textContent = req.detail;
      card.appendChild(detail);
    }
    card.appendChild(actions);
    card.appendChild(foot);

    let settled = false;
    let timer = 0;
    const settle = (answer, label) => {
      if (settled) return;
      settled = true;
      send({ type: "approval", reqId: req.req_id, answer });
      actions.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      card.classList.add(answer ? "ok" : "no");
      foot.textContent = "已选择：" + label;
      if (timer) clearInterval(timer);
    };

    (req.options || []).forEach((opt) => {
      const btn = el("button", "approval-btn");
      btn.innerHTML = `<span class="key">${escapeHtml(opt.key)}</span>` +
        `<span>${escapeHtml(opt.label)}</span>`;
      if (opt.description) btn.title = opt.description;
      btn.onclick = () => settle(opt.key, opt.label);
      actions.appendChild(btn);
    });

    const deadline = Number(req.deadline) || 0;
    const tick = () => {
      if (!deadline || settled) return;
      const left = Math.ceil(deadline - Date.now() / 1000);
      if (left <= 0) {
        if (timer) clearInterval(timer);
        actions.querySelectorAll("button").forEach((b) => { b.disabled = true; });
        foot.textContent = req.timeout_hint || "已超时，按拒绝处理";
      } else {
        foot.textContent = `剩余 ${left}s · ` + (req.timeout_hint || "");
      }
    };
    if (deadline) { timer = setInterval(tick, 500); tick(); }

    active.extras.appendChild(card);
    scrollBottom(false);
  }

  function finalize(turnId, opts) {
    const active = state.active;
    if (active && (!turnId || active.turnId === turnId)) {
      if (active.renderTimer) { clearTimeout(active.renderTimer); active.renderTimer = 0; }
      renderParts(active);
      if (!active.hasText() && !active.extras.children.length && !active.items.length) {
        active.parts.innerHTML = '<div class="md muted">（无输出）</div>';
      }
      state.doneTurns.add(active.turnId);
      if (state.doneTurns.size > 80) state.doneTurns.clear();
      state.active = null;
    }
    state.activeTurnId = "";
    state.awaiting = false;
    setBusy(false);
    $("#stop").disabled = false;
    scrollBottom(false);
    requestSessions();
  }

  /* ---------------- stream / out ---------------- */

  function onStream(ev) {
    if (!ev) return;
    if (ev.sessionId && state.session && ev.sessionId !== state.session.id) {
      toast("其它会话有新输出", "info");
      requestSessions();
      return;
    }
    if (!state.session) return;
    setBusy(true);
    let active;

    switch (ev.kind) {
      case "delta":
        active = ensureActive(ev.turnId);
        if (active.reasoningText.trim()) collapseReasoning(active);
        appendText(active, ev.content || "");
        scheduleRender(active);
        break;
      case "reasoning":
        active = ensureActive(ev.turnId);
        active.reasoningText += ev.content || "";
        updateReasoning(active);
        break;
      case "tool_call":
        active = ensureActive(ev.turnId);
        collapseReasoning(active);
        active.items.push({ type: "tool", text: ev.content || "" });
        scheduleRender(active);
        break;
      case "approval": {
        active = ensureActive(ev.turnId);
        let req = null;
        try { req = JSON.parse(ev.content); } catch (err) { req = null; }
        if (req) addApprovalCard(active, req);
        break;
      }
      case "subagent_result":
        addSubagentResult(ev.content || "");
        break;
      case "error":
        active = ensureActive(ev.turnId);
        addError(active, ev.content || "未知错误");
        finalize(ev.turnId, { error: true });
        break;
      case "done": {
        active = ensureActive(ev.turnId);
        if (ev.content && !active.hasText()) appendText(active, ev.content);
        if (ev.cancelled) addMarker(active, "已终止（以上为已生成内容）");
        if (ev.tokenUsage) addUsage(active, ev.tokenUsage);
        finalize(ev.turnId, {});
        break;
      }
      default:
        break;
    }
    scrollBottom(false);
  }

  function onOut(msg) {
    if (!msg) return;
    if (msg.sessionId && state.session && msg.sessionId !== state.session.id) {
      requestSessions();
      return;
    }
    const turnId = msg.turnId || "";
    if (turnId && state.doneTurns.has(turnId)) {
      state.doneTurns.delete(turnId);
      return;
    }
    const content = msg.body && msg.body.content;
    if (content) addAssistantStatic(content);
    if (state.busy && state.active && (!turnId || state.active.turnId === turnId)) {
      finalize(turnId, {});
    } else {
      setBusy(false);
      requestSessions();
    }
  }

  /* ---------------- dispatch ---------------- */

  function handle(msg) {
    switch (msg.type) {
      case "state": applyState(msg); break;
      case "sessions":
        state.sessions = msg.sessions || [];
        renderSessions();
        break;
      case "history": applyHistory(msg); break;
      case "stream": onStream(msg.event); break;
      case "out": onOut(msg.message); break;
      case "queued":
        state.activeTurnId = msg.turnId || "";
        break;
      case "models": showModelsModal(msg.models || [], msg.current || ""); break;
      case "tasks": showTasksModal(msg.tasks || []); break;
      case "notice":
        toast(msg.text || "", msg.level || "info");
        if (msg.level === "error") setBusy(false);
        break;
      default:
        break;
    }
  }

  /* ---------------- composer ---------------- */

  function setBusy(busy) {
    state.busy = busy;
    $("#send").disabled = busy;
    $("#stop").classList.toggle("hidden", !busy);
    if (!busy) $("#input").focus();
  }

  function autosize() {
    const input = $("#input");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  function submit() {
    const input = $("#input");
    const text = input.value.trim();
    if (!text || state.busy) return;
    if (!send({ type: "send", text })) { toast("未连接到后端", "error"); return; }
    addUser(text);
    input.value = "";
    autosize();
    state.awaiting = true;
    setBusy(true);
    scrollBottom(true);
  }

  function stopTurn() {
    const turnId = (state.active && state.active.turnId) || state.activeTurnId;
    if (!turnId) return;
    if (!send({ type: "stop", turnId })) return;
    $("#stop").disabled = true;
    toast("正在终止…", "info");
  }

  $("#input").addEventListener("input", autosize);
  $("#input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      submit();
    } else if (event.key === "Escape" && !event.isComposing) {
      if (state.busy) { event.preventDefault(); stopTurn(); }
    }
  });
  $("#send").onclick = submit;
  $("#stop").onclick = stopTurn;
  $("#new-session").onclick = () => {
    if (state.busy) { toast("当前回复未结束，稍后再新建", "info"); return; }
    send({ type: "new" });
  };
  $("#model-btn").onclick = () => {
    if (state.busy) { toast("当前回复未结束，稍后再切换模型", "info"); return; }
    if (!state.models.length) { toast("models 注册表为空", "info"); return; }
    showModelsModal(state.models, state.model);
  };
  $("#tasks-btn").onclick = () => {
    send({ type: "tasks" });
    openModal("定时任务", '<div class="muted">加载中…</div>');
  };

  /* ---------------- modal ---------------- */

  function openModal(title, html) {
    $("#modal-title").textContent = title;
    $("#modal-body").innerHTML = html;
    $("#modal").classList.remove("hidden");
  }

  function closeModal() { $("#modal").classList.add("hidden"); }

  $("#modal-close").onclick = closeModal;
  $("#modal").addEventListener("click", (event) => {
    if (event.target === $("#modal")) closeModal();
  });

  function showModelsModal(models, current) {
    const body = el("div");
    if (!models.length) {
      body.innerHTML = '<div class="muted">models 注册表为空</div>';
    }
    models.forEach((name) => {
      const item = el("div", "model-item" + (name === current ? " active" : ""));
      const label = el("span");
      label.textContent = name;
      item.appendChild(label);
      if (name === current) {
        const cur = el("span", "cur");
        cur.textContent = "当前";
        item.appendChild(cur);
      }
      item.onclick = () => {
        closeModal();
        if (name !== current) {
          toast("正在切换模型…", "info");
          send({ type: "model", model: name });
        }
      };
      body.appendChild(item);
    });
    openModal("选择模型", "");
    $("#modal-body").appendChild(body);
  }

  function showTasksModal(tasks) {
    if (tasks.length === 0) {
      openModal("定时任务", '<div class="muted">当前会话暂无定时任务</div>');
      return;
    }
    const body = el("div");
    tasks.forEach((task) => {
      const item = el("div", "task-item");
      const meta = el("div", "task-meta");
      const next = task.triggerAt ? " · 下次 " + task.triggerAt : "";
      const cron = task.cron ? " · " + task.cron : "";
      meta.textContent = `${task.status}${next}${cron} · ${task.id.slice(0, 8)}`;
      const text = el("div", "task-text");
      text.textContent = task.instruction;
      item.appendChild(meta);
      item.appendChild(text);
      body.appendChild(item);
    });
    openModal("定时任务", "");
    $("#modal-body").appendChild(body);
  }

  /* ---------------- toast ---------------- */

  function toast(text, level) {
    if (!text) return;
    const item = el("div", "toast-item" + (level === "error" ? " error" : ""));
    item.textContent = text;
    $("#toast").appendChild(item);
    setTimeout(() => {
      item.style.opacity = "0";
      item.style.transition = "opacity .3s";
      setTimeout(() => item.remove(), 320);
    }, 3600);
  }

  /* ---------------- boot ---------------- */

  (async () => {
    autosize();
    const info = await getBootstrap();
    if (info) connect(info);
  })();
})();
</script>
</body>
</html>
