<div id="toast" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  /* ================= helpers ================= */

  const $ = (sel) => document.querySelector(sel);
  const icon = (name, cls) =>
    `<svg class="icon${cls ? " " + cls : ""}"><use href="#i-${name}"/></svg>`;
  const reducedMotion =
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ================= theme ================= */

  const THEME_LABELS = { light: "日间", dark: "夜间" };

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark"
      ? "dark" : "light";
  }

  function reflectTheme(theme) {
    const name = THEME_LABELS[theme] || THEME_LABELS.light;
    const use = $("#theme-icon");
    if (use) use.setAttribute("href", theme === "dark" ? "#i-moon" : "#i-sun");
    const btn = $("#theme-btn");
    if (btn) {
      const hint = `当前为${name}，点击切换到` +
        (theme === "dark" ? THEME_LABELS.light : THEME_LABELS.dark);
      btn.title = hint;
      btn.setAttribute("aria-label", hint);
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    }
  }

  function applyTheme(theme) {
    const next = theme === "dark" ? "dark" : "light";
    // 只改根节点属性，所有颜色由 CSS 变量接管，无需重建 DOM
    document.documentElement.setAttribute("data-theme", next);
    reflectTheme(next);
    const api = window.pywebview && window.pywebview.api;
    if (api && api.set_theme) {
      // 持久化交给 Python（file:// 下 localStorage 不可用）
      Promise.resolve(api.set_theme(next)).catch(() => {});
    }
  }

  const state = {
    ws: null,
    session: null,
    sessions: [],
    model: "",
    models: [],
    cwd: "",
    historySession: "",
    busy: false,
    activeTurnId: "",
    active: null,
    doneTurns: new Set(),
    otherTurns: new Set(),
    unread: new Set(),
    connecting: false,
    reconnectCount: 0,
    booted: false,
    follow: true,
    modalKind: "",
    tasksTimer: 0,
    tasksAll: false,
    tasksPage: 0,
    tasksItems: [],
    // 首次配置 / 设置面板
    setup: null,
    config: null,
    configTab: "form",
    configSaved: false,
    configFocus: "",
    // 读入 / 保存时的配置快照，用来判断返回设置前是否有未保存修改
    configBaseline: "",
    configConfirmBack: false,
    // 权限设置页
    permission: null,
    permissionBusy: false,
    permissionError: "",
    permissionOp: "",
    permissionDraft: { root: "", unsandbox: "" },
    // 飞书通道
    feishu: null,
    feishuBusy: false,
    feishuError: "",
    // 扫码连接：qr 为后端回推的最新事件，计时器只在弹窗打开时跑
    feishuQr: null,
    qrTimer: 0,
    qrExpireAt: 0,
  };

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function clip(text, n) {
    const s = String(text || "");
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function el(tag, cls) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    return node;
  }

  /* ================= markdown ================= */

  function inlineMd(raw) {
    const codeSpans = [];
    let s = escapeHtml(raw).replace(/`([^`\n]+)`/g, (_, code) => {
      codeSpans.push(`<code>${code}</code>`);
      return `\u0001${codeSpans.length - 1}\u0001`;
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a class="md-link" href="$2" data-open-kind="url" ' +
      'data-open-value="$2" rel="noreferrer">$1</a>');
    s = s.replace(/\u0001(\d+)\u0001/g, (_, i) => codeSpans[+i]);
    return s.replace(/\n/g, "<br>");
  }

  function tableCells(line) {
    let s = line.trim();
    if (s.startsWith("|")) s = s.slice(1);
    if (s.endsWith("|")) s = s.slice(0, -1);
    return s.split("|").map((c) => c.trim());
  }

  function isTableSep(line) {
    const cells = tableCells(line);
    return cells.length > 0 && cells.every((c) => /^:?-{3,}:?$/.test(c));
  }

  function renderMarkdown(src) {
    if (!src) return "";
    const blocks = [];
    let body = String(src).replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g,
      (_, lang, code) => {
        const label = lang.trim();
        blocks.push(
          `<div class="codeblock">${label
            ? `<div class="code-lang">${escapeHtml(label)}</div>` : ""}` +
          `<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre></div>`);
        return `\n\u0000${blocks.length - 1}\u0000\n`;
      });

    const lines = body.split("\n");
    const html = [];
    let para = [];
    let list = null;
    let i = 0;

    const flushPara = () => {
      if (!para.length) return;
      html.push(`<p>${para.map(inlineMd).join("<br>")}</p>`);
      para = [];
    };
    const flushList = () => {
      if (!list) return;
      html.push(`<${list.tag}>${list.items
        .map((item) => `<li>${inlineMd(item)}</li>`).join("")}</${list.tag}>`);
      list = null;
    };

    while (i < lines.length) {
      const line = lines[i];
      const ph = line.match(/^\u0000(\d+)\u0000$/);
      if (ph) { flushPara(); flushList(); html.push(blocks[+ph[1]]); i++; continue; }
      if (!line.trim()) { flushPara(); flushList(); i++; continue; }

      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        flushPara(); flushList();
        const lv = m[1].length;
        html.push(`<h${lv}>${inlineMd(m[2])}</h${lv}>`);
        i++; continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
        flushPara(); flushList(); html.push("<hr>"); i++; continue;
      }
      m = line.match(/^>\s?(.*)$/);
      if (m) {
        flushPara(); flushList();
        html.push(`<blockquote>${inlineMd(m[1])}</blockquote>`);
        i++; continue;
      }
      if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        flushPara(); flushList();
        const header = tableCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          rows.push(tableCells(lines[i]));
          i++;
        }
        html.push(
          `<div class="table-wrap"><table><thead><tr>${header
            .map((c) => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>` +
          rows.map((r) => `<tr>${r
            .map((c) => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("") +
          "</tbody></table></div>");
        continue;
      }
      m = line.match(/^\s*[-*+]\s+(.*)$/);
      if (m) {
        flushPara();
        if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; }
        list.items.push(m[1]); i++; continue;
      }
      m = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (m) {
        flushPara();
        if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; }
        list.items.push(m[1]); i++; continue;
      }
      if (list) {
        list.items[list.items.length - 1] += "\n" + line;
        i++; continue;
      }
      para.push(line);
      i++;
    }
    flushPara(); flushList();
    return html.join("\n");
  }

  /* ================= clickable targets ================= */

  // 渲染侧兜底：正文与行内代码里的网址、绝对路径都变成可点目标。
  // 真正的协议 / 存在性校验在后端 opener 里再做一次，这里只负责识别。
  // 路径必须是独立片段（前后为空白、中文标点或句读边界）；紧邻 shell
  // 语法或整行明显是命令行时一律不识别，避免把命令行开头的路径变成链接。
  const PATH_LEAD = /[\s(（【\[《「『“‘"'，。、；：！？,.;:!?—…]/;
  const PATH_TAIL = /[\s)）】\]》」』”’"'，。、；：！？,.;:!?—…]/;
  const SHELL_ADJACENT = /[&|;<>$`\\]/;
  const SHELL_OPERATOR = /(^|\s)(&&|\|\||\||;|>>|>|<)(?=\s|$)/;
  const SHELL_PROMPT = /^\s*[$%]\s+/;
  const CJK = /[\u3400-\u9fff]/;
  // 行首是常见命令、且整行没有中文时，按命令行处理
  const COMMAND_WORDS = new Set([
    "cd", "ls", "cat", "echo", "git", "uv", "pip", "pip3", "python",
    "python3", "node", "npm", "pnpm", "yarn", "bun", "curl", "wget",
    "cp", "mv", "rm", "mkdir", "rmdir", "touch", "chmod", "chown", "ln",
    "find", "grep", "sed", "awk", "tar", "zip", "unzip", "ssh", "scp",
    "rsync", "tail", "head", "less", "more", "open", "code", "vim",
    "nano", "pytest", "ruff", "bash", "sh", "zsh", "sudo", "export",
    "source", "make", "cargo", "go", "docker", "brew", "kill", "ps",
    "which", "whereis", "systemctl", "launchctl", "nohup", "pwd", "env",
  ]);
  const LINE_TAGS = new Set([
    "P", "LI", "TD", "TH", "BLOCKQUOTE", "DD", "DT",
  ]);

  function blockLine(node) {
    for (let el = node.parentElement; el; el = el.parentElement) {
      if (LINE_TAGS.has(el.tagName)) return el.textContent;
    }
    return "";
  }

  function looksLikeCommand(node) {
    const line = blockLine(node);
    if (!line) return false;
    if (SHELL_PROMPT.test(line) || SHELL_OPERATOR.test(line)) return true;
    if (line.indexOf("`") >= 0) return true;
    const word = (line.trim().split(/\s+/)[0] || "").toLowerCase();
    return !CJK.test(line) && COMMAND_WORDS.has(word);
  }

  function targetAnchor(text, kind) {
    const a = document.createElement("a");
    a.className = "md-link";
    a.textContent = text;
    a.dataset.openKind = kind;
    a.dataset.openValue = text;
    if (kind === "url") {
      a.href = text;
      a.title = "在浏览器中打开";
      a.target = "_blank";
      a.rel = "noreferrer";
    } else {
      a.href = "#";
      a.title = "打开该文件或目录";
    }
    return a;
  }

  function trimTarget(value, kind) {
    let v = String(value).replace(/[.,;:!?。，；：！？]+$/, "");
    if (kind === "url") {
      // 正文里常见的 (url) 包一层：只去掉不成对的右括号
      while (v.endsWith(")") && v.split("(").length < v.split(")").length) {
        v = v.slice(0, -1);
      }
      while (v.endsWith("]") && v.split("[").length < v.split("]").length) {
        v = v.slice(0, -1);
      }
    }
    return v;
  }

  function exactTargetKind(raw) {
    const value = String(raw || "").trim();
    if (!value) return "";
    if (/^https?:\/\/[^/?#\s]+/i.test(value) && !/\s/.test(value)) return "url";
    if (/^(~\/|\/(?!\/)|[A-Za-z]:[\\/])/.test(value)
        && !/[\x00-\x1f<>"'`&|;$\\]/.test(value)) {
      return "path";
    }
    return "";
  }

  function linkifyTextNode(node) {
    const text = node.nodeValue;
    const parts = [];
    let cursor = 0;
    const re = /https?:\/\/[^\s<>"'`，。；：、（）【】《》「」『』“”‘’]+|(?:~\/|\/|[A-Za-z]:[\\/])[^\s<>"'`&|;$\x00-\x1f，。；：、（）【】《》「」『』“”‘’]+/g;
    let match;
    while ((match = re.exec(text)) !== null) {
      const kind = /^https?:/i.test(match[0]) ? "url" : "path";
      const value = trimTarget(match[0], kind);
      if (!value) continue;
      if (kind === "path") {
        const before = match.index > 0 ? text[match.index - 1] : "";
        const after = text[match.index + match[0].length] || "";
        // 路径要从词边界开始，避免把 and/or、URL 片段当成路径
        if (before && !PATH_LEAD.test(before)) continue;
        // 紧邻 shell 语法（&&、管道、重定向、变量、反引号）时不识别
        if (before && SHELL_ADJACENT.test(before)) continue;
        if (after && SHELL_ADJACENT.test(after)) continue;
        // 整行明显是命令行时，路径只是命令参数，保持普通文本
        if (looksLikeCommand(node)) continue;
        if (value.startsWith("//") || value === "/" || value === "~/") continue;
        const afterValue = text[match.index + value.length] || "";
        if (afterValue && !PATH_TAIL.test(afterValue)) continue;
      } else if (!/^https?:\/\/[^/?#\s]+/i.test(value)) {
        continue;
      }
      if (match.index > cursor) {
        parts.push(document.createTextNode(text.slice(cursor, match.index)));
      }
      parts.push(targetAnchor(value, kind));
      cursor = match.index + value.length;
      re.lastIndex = cursor;
    }
    if (!parts.length) return;
    if (cursor < text.length) {
      parts.push(document.createTextNode(text.slice(cursor)));
    }
    const frag = document.createDocumentFragment();
    parts.forEach((part) => frag.appendChild(part));
    node.parentNode.replaceChild(frag, node);
  }

  function linkifyTargets(root) {
    if (!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) {
          return NodeFilter.FILTER_REJECT;
        }
        for (let parent = node.parentElement; parent && parent !== root;
             parent = parent.parentElement) {
          if (/^(A|CODE|PRE|SCRIPT|STYLE|TEXTAREA)$/.test(parent.tagName)) {
            return NodeFilter.FILTER_REJECT;
          }
        }
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(linkifyTextNode);
    // 行内代码：只有整段就是路径 / 网址时才可点，避免把命令也变成链接
    root.querySelectorAll("code").forEach((code) => {
      if (code.closest("pre") || code.querySelector("a")) return;
      const raw = code.textContent.trim();
      const kind = exactTargetKind(raw);
      if (!kind) return;
      code.textContent = "";
      code.appendChild(targetAnchor(raw, kind));
    });
  }

  function renderMarkdownInto(node, text) {
    node.innerHTML = renderMarkdown(text);
    linkifyTargets(node);
  }

  async function openTarget(kind, value) {
    const api = window.pywebview && window.pywebview.api;
    if (api && api.open_target) {
      try {
        const result = await api.open_target(kind, value);
        if (!result || result.ok === false) {
          toast((result && result.error) || "打开失败", "error");
        }
      } catch (err) {
        toast("打开失败：" + err, "error");
      }
      return;
    }
    // 浏览器里没有 pywebview：网址退回新标签，路径无法安全打开
    if (kind === "url") {
      window.open(value, "_blank", "noopener");
    } else {
      toast("请在桌面客户端中打开本地路径", "info");
    }
  }

  /* ================= empty / skeleton ================= */

  function emptyStateHtml() {
    return `<div id="empty">
      <div class="empty-mark">${icon("zero")}</div>
      <h1>zero</h1>
      <div class="sub">本地桌面 AI 助手 · Web 通道</div>
      <div class="keys">
        <span class="key-item"><kbd>Enter</kbd> 发送</span>
        <span class="key-item"><kbd>Shift</kbd><kbd>Enter</kbd> 换行</span>
        <span class="key-item"><kbd>Esc</kbd> 终止回复</span>
      </div>
    </div>`;
  }

  function sessionsSkeleton(n) {
    const box = $("#sessions");
    box.innerHTML = "";
    for (let i = 0; i < n; i += 1) {
      const row = el("div", "sk-session");
      row.appendChild(el("div", "sk"));
      row.appendChild(el("div", "sk"));
      box.appendChild(row);
    }
  }

  function historySkeleton() {
    const box = $("#messages");
    box.innerHTML = "";
    for (let i = 0; i < 4; i += 1) {
      const row = el("div", "sk-row");
      row.appendChild(el("div", "sk"));
      const lines = el("div", "sk-lines");
      lines.appendChild(el("div", "sk"));
      lines.appendChild(el("div", "sk"));
      lines.appendChild(el("div", "sk"));
      row.appendChild(lines);
      box.appendChild(row);
    }
  }

  function hideSplash() {
    const splash = $("#splash");
    if (!splash) return;
    splash.classList.add("gone");
    setTimeout(() => splash.remove(), 460);
  }

  /* ================= connection ================= */

  function setConn(text, cls) {
    const dot = $("#conn-dot");
    if (!dot) return;
    dot.className = "conn-dot" + (cls ? " " + cls : "");
    // 底部不再显示文字，状态靠颜色，细节放悬停提示
    dot.title = text;
    dot.setAttribute("aria-label", text);
  }

  function waitForPywebview(timeoutMs) {
    if (window.pywebview && window.pywebview.api) return Promise.resolve();
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      window.addEventListener("pywebviewready", finish, { once: true });
      const t0 = Date.now();
      const timer = setInterval(() => {
        if (window.pywebview && window.pywebview.api) {
          clearInterval(timer); finish();
        } else if (Date.now() - t0 > timeoutMs) {
          clearInterval(timer); finish();
        }
      }, 100);
    });
  }

  async function getBootstrap() {
    await waitForPywebview(8000);
    for (let i = 0; i < 120; i++) {
      try {
        const info = await window.pywebview.api.bootstrap();
        if (info && info.error) {
          const line = $("#splash-text");
          if (line) line.textContent = info.error;
          setConn(info.error, "off");
          return null;
        }
        if (info && info.ready && info.wsUrl) return info;
        if (i === 20) {
          const line = $("#splash-text");
          if (line) line.textContent = "等待本地服务就绪…";
        }
      } catch (err) { /* api not ready yet */ }
      await sleep(100);
    }
    setConn("后端未就绪（见 debug.log）", "off");
    return null;
  }

  function connect(info) {
    const url = info.wsUrl + "?token=" + encodeURIComponent(info.token);
    const ws = new WebSocket(url);
    state.ws = ws;
    state.connecting = true;
    setConn("正在连接…", "connecting");

    ws.onopen = () => {
      const wasDown = state.reconnectCount > 0;
      state.connecting = false;
      state.reconnectCount = 0;
      setConn("已连接", "on");
      if (wasDown) {
        toast("连接已恢复", "info");
        if (state.session && state.session.id && state.historySession) {
          send({ type: "history", sessionId: state.session.id });
        }
      }
    };
    ws.onmessage = (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch (err) { return; }
      handle(data);
    };
    ws.onclose = () => {
      state.ws = null;
      if (state.connecting) {
        // 首次连接失败：短暂等待后重试，不递增计数
        state.connecting = false;
        setConn("连接失败，重试中…", "off");
        setTimeout(() => connect(info), 1200);
        return;
      }
      state.reconnectCount += 1;
      if (state.active) {
        addMarker(state.active, "连接断开，以上为已生成内容");
        finalize(state.active.turnId);
      }
      const delay = Math.min(1000 + state.reconnectCount * 700, 6000);
      setConn(`连接断开 · ${Math.round(delay / 1000)}s 后重连`, "off");
      setTimeout(() => connect(info), delay);
    };
    ws.onerror = () => {};
  }

  function send(payload) {
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return false;
    state.ws.send(JSON.stringify(payload));
    return true;
  }

  /* ================= state / sessions ================= */

  function applyState(msg) {
    const previous = state.session ? state.session.id : "";
    state.session = msg.session || { id: "", title: "" };
    state.model = msg.model || "";
    state.models = msg.models || [];
    state.sessions = msg.sessions || [];
    state.cwd = msg.cwd || "";

    $("#model-name").textContent = state.model || "model";
    renderCwd();
    $("#session-title").textContent = state.session.title || "新会话";
    $("#session-sub").textContent = state.session.id
      ? "session · " + state.session.id.slice(0, 8) : "";
    $("#new-session").disabled = false;
    renderSessions();
    // 首次使用（无 config.json / 配置不可用）→ 引导页，且不可跳过
    if (msg.setup) applySetup(msg.setup);

    if (state.session.id && state.session.id !== previous
        && state.historySession !== state.session.id) {
      historySkeleton();
      send({ type: "history", sessionId: state.session.id });
    } else if (!state.session.id && !state.busy) {
      $("#messages").innerHTML = emptyStateHtml();
    }

    if (!state.booted) {
      state.booted = true;
      hideSplash();
      setTimeout(() => $("#input").focus(), 60);
    }
  }

  function cwdBaseName(path) {
    const parts = String(path || "").split(/[\\/]+/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : String(path || "");
  }

  function renderCwd() {
    const cwd = state.cwd || "";
    const btn = $("#cwd-btn");
    const label = $("#cwd-label");
    label.textContent = cwd ? cwdBaseName(cwd) : "选择工作目录";
    btn.title = cwd || "选择会话工作目录";
    btn.classList.toggle("unset", !cwd);
  }

  function renderSessions() {
    const box = $("#sessions");
    box.innerHTML = "";
    $("#session-count").textContent = String(state.sessions.length);
    if (!state.sessions.length) {
      const empty = el("div", "session-empty");
      empty.textContent = "暂无会话";
      box.appendChild(empty);
      return;
    }
    const current = state.session ? state.session.id : "";
    state.sessions.forEach((s) => {
      const unread = state.unread.has(s.id) && s.id !== current;
      const row = el("div", "session"
        + (s.id === current ? " active" : "")
        + (unread ? " unread" : ""));
      row.setAttribute("role", "listitem");
      const title = el("div", "t");
      title.textContent = s.title || "未命名会话";
      title.title = s.title || "";
      const meta = el("div", "m");
      meta.textContent = s.updatedAt || s.date || "";
      row.appendChild(title);
      row.appendChild(meta);

      const actions = el("div", "session-actions");
      const rename = el("button", "session-action");
      rename.type = "button";
      rename.title = "重命名会话";
      rename.setAttribute("aria-label", "重命名会话");
      rename.innerHTML = icon("pencil");
      rename.onclick = (ev) => {
        ev.stopPropagation();
        openRenameSession(s);
      };
      const remove = el("button", "session-action danger");
      remove.type = "button";
      remove.title = "删除会话";
      remove.setAttribute("aria-label", "删除会话");
      remove.innerHTML = icon("trash");
      remove.onclick = (ev) => {
        ev.stopPropagation();
        openDeleteSession(s);
      };
      actions.appendChild(rename);
      actions.appendChild(remove);
      row.appendChild(actions);

      row.onclick = () => selectSession(s.id);
      box.appendChild(row);
    });
  }

  function markUnread(sessionId) {
    if (!sessionId || state.unread.has(sessionId)) return;
    if (state.session && sessionId === state.session.id) return;
    state.unread.add(sessionId);
    renderSessions();
  }

  function selectSession(id) {
    if (state.busy) { toast("当前回复未结束，稍后再切换", "info"); return; }
    if (id === state.session?.id) return;
    historySkeleton();
    send({ type: "select", sessionId: id });
  }

  function requestSessions() {
    send({ type: "sessions" });
  }

  function openRenameSession(session) {
    state.modalKind = "rename";
    openModal("重命名会话", "", "");
    const body = $("#modal-body");
    body.innerHTML = "";
    const grid = el("div", "form-grid");
    const row = el("div", "form-row");
    const label = el("label");
    label.htmlFor = "rename-input";
    label.textContent = "会话名称";
    const input = el("input", "form-input");
    input.id = "rename-input";
    input.type = "text";
    input.maxLength = 80;
    input.autocomplete = "off";
    input.value = session.title || "";
    const hint = el("div", "form-hint");
    hint.textContent = "不能为空或只有空白，最多 80 个字符。";
    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(hint);
    grid.appendChild(row);
    body.appendChild(grid);
    const commit = () => {
      const title = input.value.trim();
      if (!title) {
        toast("会话名称不能为空", "error");
        input.focus();
        return;
      }
      send({ type: "rename", sessionId: session.id, title });
      closeModal();
    };
    // 与删除确认一致：按钮在内容左下角，取消在左、主操作在右
    const actions = el("div", "dialog-actions");
    const cancel = el("button");
    cancel.id = "modal-close";
    cancel.textContent = "取消";
    const save = el("button", "primary");
    save.id = "rename-save";
    save.textContent = "保存";
    actions.appendChild(cancel);
    actions.appendChild(save);
    body.appendChild(actions);
    cancel.onclick = closeModal;
    save.onclick = commit;
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.isComposing) {
        ev.preventDefault();
        commit();
      }
    });
    setTimeout(() => {
      input.focus();
      input.select();
    }, 40);
  }

  function openDeleteSession(session) {
    if (state.busy) {
      toast("当前回复未结束，稍后再删除", "info");
      return;
    }
    state.modalKind = "delete-session";
    openModal("删除会话", "", "");
    const body = $("#modal-body");
    body.innerHTML = "";
    const warn = el("div", "perm-warn");
    warn.textContent =
      "删除后，该会话的消息、摘要与审批记录都会从本地移除，且无法恢复。";
    const name = el("div", "modal-note");
    name.textContent = "会话：" + (session.title || "未命名会话");
    body.appendChild(warn);

    // 按钮靠左下角：取消在左、删除在右；默认焦点给取消
    const actions = el("div", "dialog-actions");
    const cancel = el("button");
    cancel.id = "modal-close";
    cancel.textContent = "取消";
    const remove = el("button", "danger");
    remove.id = "delete-save";
    remove.textContent = "删除";
    actions.appendChild(cancel);
    actions.appendChild(remove);
    body.appendChild(actions);
    cancel.onclick = closeModal;
    remove.onclick = () => {
      send({ type: "delete", sessionId: session.id });
      closeModal();
    };
    setTimeout(() => cancel.focus(), 30);
  }

  /* ================= message rendering ================= */

  function removeEmpty() {
    const empty = $("#empty");
    if (empty) empty.remove();
  }

  function nearBottom() {
    const box = $("#messages");
    return box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  }

  let scrollQueued = false;
  function scrollBottom(force) {
    const box = $("#messages");
    if (force) state.follow = true;
    if (!state.follow) {
      updateJump(true);
      return;
    }
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => {
      scrollQueued = false;
      box.scrollTop = box.scrollHeight;
      updateJump(false);
    });
  }

  function updateJump(show) {
    $("#jump").classList.toggle("show", !!show);
  }

  function assistantRow(avatarIcon, avatarClass) {
    const row = el("div", "msg assistant");
    const avatar = el("div", "avatar" + (avatarClass ? " " + avatarClass : ""));
    avatar.innerHTML = icon(avatarIcon);
    const bubble = el("div", "bubble");
    row.appendChild(avatar);
    row.appendChild(bubble);
    $("#messages").appendChild(row);
    return { row, bubble };
  }

  // 每条消息都显示自己的时间；同一分钟内出现重复时间是预期行为
  function stampLabel(date) {
    const pad = (n) => String(n).padStart(2, "0");
    const time = pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":"
      + pad(date.getSeconds());
    const now = new Date();
    const sameDay = date.getFullYear() === now.getFullYear()
      && date.getMonth() === now.getMonth()
      && date.getDate() === now.getDate();
    if (sameDay) return time;
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-"
      + pad(date.getDate()) + " " + time;
  }

  function ensureMeta(row) {
    let meta = row.querySelector(".msg-meta");
    if (!meta) {
      meta = el("div", "msg-meta");
      row.appendChild(meta);
    }
    return meta;
  }

  function appendStamp(row, at) {
    const raw = Number(at);
    const date = new Date(Number.isFinite(raw) && raw > 0 ? raw : Date.now());
    const stamp = el("span", "msg-time");
    stamp.textContent = stampLabel(date);
    stamp.title = date.toLocaleString("zh-CN", { hour12: false });
    ensureMeta(row).appendChild(stamp);
  }

  function addUser(text, at) {
    removeEmpty();
    const row = el("div", "msg user");
    const bubble = el("div", "bubble");
    bubble.textContent = text;
    row.appendChild(bubble);
    appendStamp(row, at);
    $("#messages").appendChild(row);
    scrollBottom(true);
    return row;
  }

  function addAssistantStatic(text) {
    removeEmpty();
    const { row, bubble } = assistantRow("zero");
    const content = el("div", "md");
    renderMarkdownInto(content, text);
    bubble.appendChild(content);
    scrollBottom(false);
    return row;
  }

  function addCompact(text) {
    removeEmpty();
    const row = el("div", "compact-note");
    const label = el("span", "lbl");
    label.textContent = "已压缩的历史上下文";
    row.appendChild(label);
    row.appendChild(document.createTextNode(clip(text, 600)));
    $("#messages").appendChild(row);
    return row;
  }

  function addSubagentResult(text) {
    removeEmpty();
    const { row, bubble } = assistantRow("branch", "sub");
    const card = el("div", "subagent");
    const label = el("div", "lbl");
    label.innerHTML = icon("branch") + "<span>子 agent 结果</span>";
    const body = el("div", "md");
    renderMarkdownInto(body, text);
    card.appendChild(label);
    card.appendChild(body);
    bubble.appendChild(card);
    scrollBottom(false);
    return row;
  }

  function buildHistoryTurns(messages, approvals) {
    const turns = [];
    let current = null;
    const startTurn = (user) => {
      current = {
        user: user || null, entries: [], turnIds: new Set(), at: 0};
      turns.push(current);
      return current;
    };
    messages.forEach((m) => {
      if (m.compact) {
        turns.push({ compact: m });
        current = null;
        return;
      }
      if (m.role === "user") {
        startTurn(m);
        return;
      }
      if (m.role !== "assistant") return;
      const turnId = m.turnId || "";
      if (!current) {
        startTurn(null);
      } else if (turnId && current.turnIds.size
          && !current.turnIds.has(turnId)) {
        startTurn(null);
      }
      if (turnId) current.turnIds.add(turnId);
      const at = Number(m.at) || 0;
      current.at = at || current.at;
      (m.toolCalls || []).forEach((call) => {
        current.entries.push({
          kind: "tool",
          at,
          text: `${call.name || ""}(${call.arguments || ""})`,
        });
      });
      if ((m.content || "").trim()) {
        current.entries.push({
          kind: "text", at, text: m.content, usage: m.usage || null,
          fileChanges: m.fileChanges || null,
        });
      }
    });

    const byTurnId = new Map();
    turns.forEach((t) => {
      if (!t.entries) return;
      t.turnIds.forEach((id) => byTurnId.set(id, t));
    });
    (approvals || []).forEach((rec) => {
      // 轮次已被丢弃（崩溃残留）或压缩掉时不显示：宁可少一张卡，
      // 也不能把它挂到别的轮次或造一个只有审批卡的空轮次
      const target = rec.turnId ? byTurnId.get(rec.turnId) : null;
      if (!target) return;
      target.entries.push({
        kind: "approval",
        at: Number(rec.at) || 0,
        approval: rec,
      });
    });
    turns.forEach((t) => {
      if (t.entries) t.entries.sort((a, b) => a.at - b.at);
    });
    return turns;
  }

  function isCollapsibleNode(node) {
    return node.matches(
      "details.tool-chip, details.approval, details.reasoning");
  }

  function newRunGroup(nodes) {
    const tools = nodes.filter(
      (n) => n.classList.contains("tool-chip")).length;
    const approvals = nodes.filter(
      (n) => n.classList.contains("approval")).length;
    const labels = [];
    if (tools) labels.push(`${tools} 个工具调用`);
    if (approvals) labels.push(`${approvals} 个审批`);
    // 纯思考的连续段极少见；标题仍以工具/审批计数为主
    if (!labels.length) labels.push("思考");
    const group = el("details", "run-group");
    const head = el("summary", "run-summary");
    head.innerHTML = icon(tools ? "terminal" : (approvals ? "alert" : "spark")) +
      `<span>${labels.join(" · ")}</span>` +
      icon("chevron", "run-caret");
    const body = el("div", "run-group-body");
    group.appendChild(head);
    group.appendChild(body);
    return { group, body };
  }

  function appendGrouped(container, nodes) {
    let run = [];
    const flush = () => {
      if (!run.length) return;
      if (run.length === 1) {
        container.appendChild(run[0]);
      } else {
        const { group, body } = newRunGroup(run);
        container.appendChild(group);
        run.forEach((node) => body.appendChild(node));
      }
      run = [];
    };
    nodes.forEach((node) => {
      if (isCollapsibleNode(node)) {
        run.push(node);
      } else {
        flush();
        container.appendChild(node);
      }
    });
    flush();
  }

  function groupCollapsibleRuns(container) {
    const children = Array.from(container.children);
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        const { group, body } = newRunGroup(run);
        container.insertBefore(group, run[0]);
        run.forEach((node) => body.appendChild(node));
      }
      run = [];
    };
    children.forEach((node) => {
      if (isCollapsibleNode(node)) {
        run.push(node);
      } else {
        flush();
      }
    });
    flush();
  }

  function addHistoricalTurn(turn) {
    removeEmpty();
    const { row, bubble } = assistantRow("zero");
    appendStamp(row, turn.at);
    const parts = el("div", "parts");
    bubble.appendChild(parts);
    const nodes = turn.entries.map((entry) => {
      if (entry.kind === "tool") return buildToolChip(entry.text, true);
      if (entry.kind === "approval") {
        return buildApprovalHistoryCard(entry.approval);
      }
      const part = el("div", "part-text");
      const md = el("div", "md");
      md.innerHTML = renderMarkdown(entry.text);
      linkifyTargets(md);
      part.appendChild(md);
      return part;
    });
    appendGrouped(parts, nodes);
    const usage = turn.entries.reduce(
      (last, entry) => entry.usage || last, null);
    const changes = turn.entries.reduce(
      (last, entry) => entry.fileChanges || last, null);
    if (changes && changes.length) appendChanges(bubble, changes);
    if (usage) addUsage(row, usage);
    scrollBottom(false);
    return row;
  }

  function applyHistory(msg) {
    if (!state.session || msg.sessionId !== state.session.id) return;
    state.historySession = msg.sessionId;
    if (state.unread.delete(msg.sessionId)) renderSessions();
    if (state.active && state.active.renderTimer) {
      clearTimeout(state.active.renderTimer);
    }
    state.active = null;
    state.activeTurnId = "";
    setBusy(false);

    const box = $("#messages");
    box.innerHTML = "";
    const turns = buildHistoryTurns(
      msg.messages || [], msg.approvals || []);
    const rows = [];
    turns.forEach((turn) => {
      if (turn.compact) {
        rows.push(addCompact(turn.compact.content));
        return;
      }
      if (turn.user) rows.push(addUser(turn.user.content, turn.user.at));
      if (turn.entries.length) rows.push(addHistoricalTurn(turn));
    });
    rows.forEach((row, index) => {
      if (row) row.style.animationDelay = Math.min(index * 14, 150) + "ms";
    });
    if (!turns.length) {
      box.innerHTML = emptyStateHtml();
    }
    state.follow = true;
    box.scrollTop = box.scrollHeight;
    updateJump(false);
  }

  /* ================= active turn ================= */

  function createAssistantBubble(turnId) {
    removeEmpty();
    const { row, bubble } = assistantRow("zero");
    appendStamp(row, Date.now());

    const status = el("div", "turn-status");
    status.dataset.state = "thinking";
    const parts = el("div", "parts");
    const extras = el("div", "extras");
    bubble.appendChild(status);
    bubble.appendChild(parts);
    bubble.appendChild(extras);

    const active = {
      turnId,
      row,
      bubble,
      status,
      reasoningSegment: null,
      parts,
      extras,
      items: [],
      pendingText: new Set(),
      renderTimer: 0,
      hasText() {
        return this.items.some((p) => p.type === "text" && p.text.trim());
      },
    };
    setStatus(active, "thinking", "正在思考", true);
    scrollBottom(false);
    return active;
  }

  function setStatus(active, kind, label, withDots) {
    if (!active) return;
    const node = active.status;
    const changed = node.dataset.state !== (kind || "done");
    node.dataset.state = kind || "done";
    if (!kind) {
      node.innerHTML = "";
      return;
    }
    node.innerHTML =
      '<span class="status-dot"></span>' +
      `<span class="status-text">${escapeHtml(label)}</span>` +
      (withDots ? '<span class="dots"><i></i><i></i><i></i></span>' : "");
    if (changed) {
      node.style.animation = "none";
      void node.offsetWidth;
      node.style.animation = "";
    }
  }

  function ensureActive(turnId) {
    if (state.active) {
      if (!state.active.turnId && turnId) {
        state.active.turnId = turnId;
        return state.active;
      }
      if (!turnId || state.active.turnId === turnId) return state.active;
      finalize(state.active.turnId);
    }
    state.active = createAssistantBubble(turnId || state.activeTurnId || "");
    return state.active;
  }

  function appendText(active, text) {
    const last = active.items[active.items.length - 1];
    let item = last && last.type === "text" ? last : null;
    if (!item) {
      item = { type: "text", text: "" };
      active.items.push(item);
      const part = el("div", "part-text");
      const md = el("div", "md");
      part.appendChild(md);
      active.parts.appendChild(part);
      item.node = md;
    }
    item.text += text;
    active.pendingText.add(item);
    scheduleRender(active);
  }

  function buildToolChip(raw, done) {
    const text = String(raw || "").trim();
    const cut = text.indexOf("(");
    const name = cut > 0 ? text.slice(0, cut) : text;
    const rest = cut > 0 ? text.slice(cut) : "";
    const args = rest.startsWith("(") && rest.endsWith(")")
      ? rest.slice(1, -1) : rest;
    const chip = el("details", "tool-chip" + (done ? " done" : ""));
    // 实时轮次默认展开参数；轮次结束后由 finalize 统一折叠
    chip.open = !done;
    const head = el("summary", "tool-head");
    head.innerHTML = icon("terminal", "tool-ico") +
      `<span class="tool-name">${escapeHtml(clip(name, 60))}</span>` +
      `<span class="tool-preview">${escapeHtml(clip(args, 90))}</span>` +
      icon("chevron", "tool-caret");
    const body = el("pre", "tool-body");
    body.textContent = args || "（无参数）";
    chip.appendChild(head);
    chip.appendChild(body);
    return chip;
  }

  function addToolChip(active, raw) {
    active.items.push({ type: "tool", text: String(raw || "") });
    active.parts.appendChild(buildToolChip(raw, false));
    scrollBottom(false);
  }

  function scheduleRender(active) {
    if (active.renderTimer) return;
    active.renderTimer = setTimeout(() => {
      active.renderTimer = 0;
      flushRender(active);
    }, reducedMotion ? 0 : 60);
  }

  function flushRender(active) {
    if (!active.pendingText.size) return;
    // 一个节流窗口里可能同时产生多个正文段（文本→工具→文本），
    // 必须全部渲染，否则前一段会一直停在空节点
    active.pendingText.forEach((item) => {
      if (item.node) {
        item.node.innerHTML = renderMarkdown(item.text);
        linkifyTargets(item.node);
      }
    });
    active.pendingText.clear();
    scrollBottom(false);
  }

  function startReasoning(active) {
    const box = el("details", "reasoning");
    box.open = true;
    box.innerHTML =
      `<summary>${icon("chevron")}<span class="rs-label">思考</span></summary><pre></pre>`;
    const seg = {
      box,
      pre: box.querySelector("pre"),
      label: box.querySelector(".rs-label"),
      text: "",
    };
    active.reasoningSegment = seg;
    active.parts.appendChild(box);
    return seg;
  }

  function appendReasoning(active, text) {
    if (!text) return;
    const seg = active.reasoningSegment || startReasoning(active);
    seg.text += text;
    seg.pre.textContent = seg.text;
    seg.label.textContent = `思考 · ${seg.text.length} 字`;
    scrollBottom(false);
  }

  function endReasoning(active) {
    const seg = active.reasoningSegment;
    if (!seg) return;
    active.reasoningSegment = null;
    const length = seg.text.trim().length;
    if (!length) {
      seg.box.remove();
      return;
    }
    seg.box.open = false;
    seg.label.textContent = `思考 · ${length} 字（已折叠）`;
  }

  function addError(active, text) {
    const box = el("div", "marker is-error");
    box.textContent = "错误：" + text;
    active.extras.appendChild(box);
  }

  function addMarker(active, text) {
    const box = el("div", "marker");
    box.textContent = text;
    active.extras.appendChild(box);
  }

  const CHANGE_LABELS = {
    added: "新增", modified: "修改", deleted: "删除",
  };
  const CHANGE_GROUP_THRESHOLD = 20;
  // 锁文件是有意义的单点变化，即使落在批量目录里也单独列出
  const LOCKFILES = new Set([
    "uv.lock", "poetry.lock", "Pipfile.lock", "package-lock.json",
    "yarn.lock", "pnpm-lock.yaml", "Cargo.lock", "go.sum",
    "composer.lock", "Gemfile.lock",
  ]);

  function changeRow(item, withBadge) {
    const change = String(item.change || "");
    const path = String(item.path || "");
    const li = el("li");
    if (withBadge) {
      const badge = el("span", "change-badge " + change);
      badge.textContent = CHANGE_LABELS[change] || "改动";
      li.appendChild(badge);
    }
    const link = targetAnchor(path, "path");
    link.classList.add("turn-change-path");
    li.appendChild(link);
    return li;
  }

  // 本轮改动清单：绝对路径复用现有路径点击逻辑（后端仍会做存在性校验）
  function appendChanges(bubble, changes) {
    if (!bubble || !changes || !changes.length) return;
    const box = el("div", "turn-changes");
    const head = el("div", "turn-changes-title");
    head.textContent = "本轮改动";
    const list = el("ul", "turn-changes-list");

    const groups = [];
    const singles = [];
    const hiddenCounts = [];
    const legacyByDir = new Map();
    changes.forEach((item) => {
      const path = String(item.path || "");
      if (item.change === "hidden") {
        hiddenCounts.push(Number(item.count) || 0);
        return;
      }
      if (!path) return;
      if (item.change === "group") {
        groups.push(item);
        return;
      }
      const base = path.slice(path.lastIndexOf("/") + 1);
      if (LOCKFILES.has(base)) {
        singles.push(item);
        return;
      }
      const cut = path.lastIndexOf("/");
      const dir = cut > 0 ? path.slice(0, cut) : "/";
      if (!legacyByDir.has(dir)) legacyByDir.set(dir, []);
      legacyByDir.get(dir).push(item);
    });
    legacyByDir.forEach((items, dir) => {
      if (items.length > CHANGE_GROUP_THRESHOLD) {
        groups.push({
          path: dir, change: "group", count: items.length,
          files: items, hiddenCount: 0, blocked: false,
        });
      } else {
        items.forEach((item) => singles.push(item));
      }
    });
    singles.sort((a, b) => String(a.path).localeCompare(String(b.path)));
    groups.sort((a, b) => String(a.path).localeCompare(String(b.path)));

    groups.forEach((item) => {
      const files = Array.isArray(item.files) ? item.files : [];
      const count = Number(item.count) || files.length;
      const hidden = Number(item.hiddenCount) || 0;
      const row = el("li", "change-group");
      const isBlocked = !!item.blocked;
      const headRow = el(isBlocked ? "div" : "button", "change-group-head");
      if (!isBlocked) {
        headRow.type = "button";
        headRow.setAttribute("aria-expanded", "false");
      }
      const badge = el("span", "change-badge bulk");
      badge.textContent = "批量 " + count + (item.capped ? "+" : "");
      const pathLabel = el("span", "turn-change-path");
      pathLabel.textContent = String(item.path || "");
      headRow.appendChild(badge);
      headRow.appendChild(pathLabel);
      row.appendChild(headRow);

      if (isBlocked) {
        const note = el("span", "change-group-note");
        note.textContent = "依赖/缓存目录，明细已折叠";
        headRow.appendChild(note);
        list.appendChild(row);
        return;
      }

      const hint = el("span", "change-group-hint");
      hint.textContent = "展开";
      headRow.appendChild(hint);
      const detail = el("ul", "change-group-list hidden");
      files.forEach((file) => detail.appendChild(changeRow(file, true)));
      if (hidden > 0) {
        const note = el("li", "change-hidden");
        note.textContent = "另有 " + hidden + " 个文件未列出";
        detail.appendChild(note);
      }
      headRow.addEventListener("click", () => {
        const isHidden = detail.classList.toggle("hidden");
        hint.textContent = isHidden ? "展开" : "收起";
        headRow.setAttribute("aria-expanded", isHidden ? "false" : "true");
      });
      row.appendChild(detail);
      list.appendChild(row);
    });

    singles.forEach((item) => list.appendChild(changeRow(item, true)));
    if (hiddenCounts.length) {
      const total = hiddenCounts.reduce((sum, n) => sum + n, 0);
      const note = el("li", "change-hidden");
      note.textContent = "另有 " + total + " 个文件未列出";
      list.appendChild(note);
    }

    box.appendChild(head);
    box.appendChild(list);
    bubble.appendChild(box);
  }

  function addUsage(row, usage) {
    if (!row || !usage) return;
    const box = el("span", "msg-usage");
    box.textContent =
      `tokens ${usage.promptTokens || 0} in · ${usage.completionTokens || 0} out · ` +
      `${usage.totalTokens || 0} total`;
    ensureMeta(row).appendChild(box);
  }

  function addApprovalCard(active, req) {
    endReasoning(active);
    setStatus(active, "approval", "等待你的确认");

    const card = el("details", "approval");
    // 实时轮次默认展开；轮次结束后由 finalize 统一折叠
    card.open = true;
    card.dataset.state = "pending";
    const head = el("summary", "approval-head");
    const title = escapeHtml(req.title || "需要确认");
    const paintHead = (name, tag) => {
      head.innerHTML = icon(name) +
        `<span class="approval-title">${title}</span>` +
        `<span class="approval-tag">${escapeHtml(tag)}</span>` +
        icon("chevron", "approval-caret");
    };
    paintHead("alert", "等待确认");
    const body = el("div", "approval-body");
    const summary = el("div", "approval-summary");
    summary.textContent = req.summary || "";
    const actions = el("div", "approval-actions");
    const foot = el("div", "approval-foot");
    body.appendChild(summary);
    if (req.detail) {
      const detail = el("div", "approval-detail");
      detail.textContent = req.detail;
      body.appendChild(detail);
    }
    body.appendChild(actions);
    body.appendChild(foot);
    card.appendChild(head);
    card.appendChild(body);

    let settled = false;
    let timer = 0;
    const settle = (answer, label) => {
      if (settled) return;
      settled = true;
      send({ type: "approval", reqId: req.req_id, answer });
      actions.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      card.classList.add(answer === "n" ? "no" : "ok");
      card.dataset.state = "settled";
      paintHead(answer === "n" ? "x" : "check",
        answer === "n" ? "已拒绝" : "已允许");
      foot.textContent = "已选择：" + label;
      if (timer) clearInterval(timer);
      setStatus(active, "thinking", "正在继续", true);
    };

    (req.options || []).forEach((opt, index) => {
      const btn = el("button", "approval-btn" + (index === 0 ? " primary" : ""));
      btn.innerHTML = `<span class="key">${escapeHtml(opt.key)}</span>` +
        `<span>${escapeHtml(opt.label)}</span>`;
      if (opt.description) btn.title = opt.description;
      btn.onclick = () => settle(opt.key, opt.label);
      actions.appendChild(btn);
    });

    const deadline = Number(req.deadline) || 0;
    const tick = () => {
      if (!deadline || settled) return;
      if (!card.isConnected) {
        if (timer) clearInterval(timer);
        return;
      }
      const left = Math.ceil(deadline - Date.now() / 1000);
      if (left <= 0) {
        if (timer) clearInterval(timer);
        actions.querySelectorAll("button").forEach((b) => { b.disabled = true; });
        foot.textContent = req.timeout_hint || "已超时，按拒绝处理";
        card.dataset.state = "timeout";
        paintHead("alert", "已超时");
      } else {
        foot.textContent = `剩余 ${left}s · ` + (req.timeout_hint || "");
      }
    };
    if (deadline) { timer = setInterval(tick, 500); tick(); }

    // 审批卡按发生顺序插进 parts，而不是永远挂在气泡最底部：
    // 后续的工具调用/正文会自然排在它后面
    active.items.push({ type: "approval" });
    active.parts.appendChild(card);
    scrollBottom(false);
  }

  function approvalOutcome(rec) {
    if (rec.status === "timeout") return "已超时，按拒绝处理";
    if (rec.status === "cancelled") return "本轮已终止，审批未完成";
    const opt = (rec.options || []).find((o) => o.key === rec.answer);
    return "结果：" + (opt ? opt.label : (rec.answer || "已处理"));
  }

  function buildApprovalHistoryCard(rec) {
    const denied = rec.status === "answered" && rec.answer === "n";
    // 历史轮次默认折叠，只保留标题与结论；展开看命令、选项和结果
    const card = el("details", "approval history");
    if (rec.status === "answered") card.classList.add(denied ? "no" : "ok");
    const head = el("summary", "approval-head");
    const ok = rec.status === "answered" && !denied;
    const tag = rec.status === "timeout" ? "已超时"
      : rec.status === "cancelled" ? "已终止"
        : (denied ? "已拒绝" : "已允许");
    head.innerHTML = icon(ok ? "check" : (denied ? "x" : "alert")) +
      `<span class="approval-title">${escapeHtml(rec.title || "需要确认")}</span>` +
      `<span class="approval-tag">${tag}</span>` +
      icon("chevron", "approval-caret");
    card.appendChild(head);
    const body = el("div", "approval-body");
    if (rec.summary) {
      const summary = el("div", "approval-summary");
      summary.textContent = rec.summary;
      body.appendChild(summary);
    }
    if (rec.detail) {
      const detail = el("div", "approval-detail");
      detail.textContent = rec.detail;
      body.appendChild(detail);
    }
    const options = rec.options || [];
    if (options.length) {
      const choices = el("div", "approval-choices");
      options.forEach((opt) => {
        const chip = el("span",
          "approval-choice" + (opt.key === rec.answer ? " chosen" : ""));
        chip.innerHTML = `<span class="key">${escapeHtml(opt.key)}</span>` +
          `<span>${escapeHtml(opt.label)}</span>`;
        if (opt.description) chip.title = opt.description;
        choices.appendChild(chip);
      });
      body.appendChild(choices);
    }
    const foot = el("div", "approval-foot");
    foot.textContent = approvalOutcome(rec);
    body.appendChild(foot);
    card.appendChild(body);
    return card;
  }

  function finalize(turnId) {
    const active = state.active;
    if (active && (!turnId || active.turnId === turnId)) {
      if (active.renderTimer) { clearTimeout(active.renderTimer); active.renderTimer = 0; }
      flushRender(active);
      endReasoning(active);
      // 轮次结束后统一折叠工具参数、审批详情与思考段
      active.parts.querySelectorAll(
        "details.tool-chip, details.approval, details.reasoning")
        .forEach((box) => {
          box.open = false;
          if (box.classList.contains("tool-chip")) {
            box.classList.add("done");
          } else if (box.dataset.state === "pending") {
            const tag = box.querySelector(".approval-tag");
            if (tag) tag.textContent = "未完成";
          }
        });
      // 连续的多个工具/审批折叠成一行，点开后再逐个展开
      groupCollapsibleRuns(active.parts);
      setStatus(active, "done");
      if (!active.hasText() && !active.extras.children.length
          && !active.items.length
          && !active.parts.querySelector("details.reasoning")) {
        active.parts.innerHTML = '<div class="md muted">（无输出）</div>';
      }
      state.doneTurns.add(active.turnId);
      if (state.doneTurns.size > 80) state.doneTurns.clear();
      state.active = null;
    }
    state.activeTurnId = "";
    setBusy(false);
    $("#stop").disabled = false;
    scrollBottom(false);
    requestSessions();
  }

  /* ================= stream / out ================= */

  function onStream(ev) {
    if (!ev) return;
    if (ev.sessionId && state.session && ev.sessionId !== state.session.id) {
      // 同一轮会有 reasoning/delta/tool_call/done 多个流事件：
      // 按 turnId 去重，只在首次提示一次，避免一次回复弹出一串 toast
      if (ev.turnId && !state.otherTurns.has(ev.turnId)) {
        state.otherTurns.add(ev.turnId);
        if (state.otherTurns.size > 80) state.otherTurns.clear();
        toast("其它会话有新输出", "info");
        requestSessions();
      }
      markUnread(ev.sessionId);
      return;
    }
    if (!state.session) return;
    setBusy(true);
    let active;

    switch (ev.kind) {
      case "delta":
        active = ensureActive(ev.turnId);
        endReasoning(active);
        appendText(active, ev.content || "");
        setStatus(active, "streaming", "正在输出");
        break;
      case "reasoning":
        active = ensureActive(ev.turnId);
        appendReasoning(active, ev.content || "");
        setStatus(active, "thinking", "正在思考", true);
        break;
      case "tool_call":
        active = ensureActive(ev.turnId);
        endReasoning(active);
        addToolChip(active, ev.content || "");
        setStatus(active, "tool", "正在执行工具", true);
        break;
      case "approval": {
        active = ensureActive(ev.turnId);
        let req = null;
        try { req = JSON.parse(ev.content); } catch (err) { req = null; }
        if (req) addApprovalCard(active, req);
        break;
      }
      case "subagent_result":
        endReasoning(state.active);
        addSubagentResult(ev.content || "");
        break;
      case "error":
        active = ensureActive(ev.turnId);
        addError(active, ev.content || "未知错误");
        finalize(ev.turnId);
        break;
      case "done": {
        active = ensureActive(ev.turnId);
        if (ev.content && !active.hasText()) {
          active.items.push({ type: "text", text: ev.content });
          const part = el("div", "part-text");
          const md = el("div", "md");
          renderMarkdownInto(md, ev.content);
          part.appendChild(md);
          active.parts.appendChild(part);
        }
        if (ev.cancelled) addMarker(active, "已终止（以上为已生成内容）");
        if (ev.fileChanges && active) appendChanges(active.bubble, ev.fileChanges);
        if (ev.tokenUsage) addUsage(active.row, ev.tokenUsage);
        finalize(ev.turnId);
        break;
      }
      default:
        break;
    }
    scrollBottom(false);
  }

  function onOut(msg) {
    if (!msg) return;
    if (msg.sessionId && state.session && msg.sessionId !== state.session.id) {
      markUnread(msg.sessionId);
      requestSessions();
      return;
    }
    const turnId = msg.turnId || "";
    if (turnId && state.doneTurns.has(turnId)) {
      state.doneTurns.delete(turnId);
      return;
    }
    const content = msg.body && msg.body.content;
    if (content) addAssistantStatic(content);
    if (state.busy && state.active && (!turnId || state.active.turnId === turnId)) {
      finalize(turnId);
    } else {
      setBusy(false);
      requestSessions();
    }
  }

  /* ================= dispatch ================= */

  function handle(msg) {
    switch (msg.type) {
      case "state": applyState(msg); break;
      case "sessions":
        state.sessions = msg.sessions || [];
        renderSessions();
        break;
      case "history": applyHistory(msg); break;
      case "stream": onStream(msg.event); break;
      case "out": onOut(msg.message); break;
      case "queued": {
        state.activeTurnId = msg.turnId || "";
        if (!msg.sessionId || msg.sessionId === state.session?.id) {
          const active = ensureActive(state.activeTurnId);
          setStatus(active, "thinking", "已发送，等待模型响应", true);
        }
        break;
      }
      case "tasks": {
        clearTimeout(state.tasksTimer);
        state.tasksTimer = 0;
        if (state.modalKind !== "tasks") break;
        state.tasksAll = !!msg.all;
        state.tasksItems = msg.tasks || [];
        renderTasksScope();
        renderTasksModal();
        break;
      }
      case "skills":
        if (state.modalKind === "skills") renderSkills(msg.skills || []);
        break;
      case "config":
        onConfig(msg);
        break;
      case "permission":
        onPermission(msg);
        break;
      case "feishu":
        onFeishu(msg);
        break;
      case "notice":
        toast(msg.text || "", msg.level || "info");
        if (msg.level === "error") {
          if (state.active && !state.active.items.length
              && !state.active.extras.children.length) {
            state.active.row.remove();
            state.active = null;
            state.activeTurnId = "";
          }
          setBusy(false);
        }
        break;
      default:
        break;
    }
  }

  /* ================= composer ================= */

  function setBusy(busy) {
    state.busy = busy;
    $("#send").disabled = busy;
    $("#stop").classList.toggle("hidden", !busy);
    if (!busy && $("#modal").classList.contains("hidden")) $("#input").focus();
  }

  function autosize() {
    const input = $("#input");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  function submit() {
    const input = $("#input");
    const text = input.value.trim();
    if (!text || state.busy) return;
    if (state.setup && state.setup.required) {
      toast("请先完成首次配置", "info");
      return;
    }
    if (!send({ type: "send", text })) {
      toast("未连接到后端，消息未发送", "error");
      return;
    }
    addUser(text);
    input.value = "";
    autosize();
    state.active = createAssistantBubble("");
    setStatus(state.active, "thinking", "正在发送", true);
    setBusy(true);
    scrollBottom(true);
  }

  function stopTurn() {
    const turnId = (state.active && state.active.turnId) || state.activeTurnId;
    if (!turnId) return;
    if (!send({ type: "stop", turnId })) return;
    $("#stop").disabled = true;
    toast("正在终止…", "info");
  }

  $("#input").addEventListener("input", autosize);
  $("#input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      submit();
    } else if (event.key === "Escape" && !event.isComposing) {
      if (state.busy && $("#modal").classList.contains("hidden")) {
        event.preventDefault();
        stopTurn();
      }
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || event.isComposing) return;
    if (setupVisible()) return; // 首次配置引导不可关闭
    if (!$("#modal").classList.contains("hidden")) {
      event.preventDefault();
      closeModal();
    } else if (state.busy && event.target !== $("#input")) {
      event.preventDefault();
      stopTurn();
    }
  });
  $("#send").onclick = submit;
  $("#stop").onclick = stopTurn;
  $("#new-session").onclick = () => {
    if (state.busy) { toast("当前回复未结束，稍后再新建", "info"); return; }
    if (!send({ type: "new" })) { toast("未连接到后端", "error"); return; }
    $("#new-session").disabled = true;
  };
  $("#model-btn").onclick = () => {
    if (state.busy) { toast("当前回复未结束，稍后再切换模型", "info"); return; }
    if (!state.models.length) { toast("models 注册表为空", "info"); return; }
    showModelsModal(state.models, state.model);
  };
  $("#cwd-btn").onclick = () => {
    if (state.busy) { toast("当前回复未结束，稍后再切换工作目录", "info"); return; }
    showCwdModal();
  };
  $("#tasks-btn").onclick = openTasksModal;
  $("#settings-btn").onclick = openSettingsModal;
  $("#feishu-status").onclick = openFeishuModal;
  // 聊天里的链接统一交给系统打开：网址走浏览器，路径走文件管理器
  $("#messages").addEventListener("click", (ev) => {
    const link = ev.target.closest("a.md-link");
    if (!link) return;
    ev.preventDefault();
    openTarget(link.dataset.openKind, link.dataset.openValue);
  });
  $("#config-restart").onclick = () => beginRestart();
  $("#config-dismiss").onclick = () => $("#config-banner").classList.add("hidden");
  $("#setup-save").onclick = setupSubmit;
  $("#setup-test").onclick = setupTest;
  $("#theme-btn").onclick = () => {
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
  };
  reflectTheme(currentTheme());
  $("#jump").onclick = () => {
    state.follow = true;
    const box = $("#messages");
    box.scrollTo({
      top: box.scrollHeight,
      behavior: reducedMotion ? "auto" : "smooth",
    });
    updateJump(false);
  };
  $("#messages").addEventListener("scroll", () => {
    state.follow = nearBottom();
    updateJump(!state.follow);
  }, { passive: true });

  /* ================= modal ================= */

  function openModal(title, html, actionsHtml) {
    $("#modal-title").textContent = title;
    $("#modal-actions").innerHTML = actionsHtml || "";
    const body = $("#modal-body");
    body.className = "modal-body";
    body.innerHTML = html;
    $("#modal").classList.remove("hidden");
  }

  function closeModal() {
    if (state.modalKind === "feishu-qr") {
      // 关掉弹窗就停倒计时并让后端取消轮询：不留后台任务
      stopQrCountdown();
      state.feishuQr = null;
      send({ type: "feishu", op: "qr-cancel" });
    }
    $("#modal").classList.add("hidden");
    state.modalKind = "";
    state.configConfirmBack = false;
    clearTimeout(state.tasksTimer);
    state.tasksTimer = 0;
    $("#input").focus();

    $("#modal-close").onclick = closeModal;
    const body = $("#modal-body");
    body.innerHTML = "";
    if (!models.length) {
      body.innerHTML = '<div class="modal-note">models 注册表为空</div>';

  async function pickFolder(start) {
    try {
      const api = window.pywebview && window.pywebview.api;
      if (!api || typeof api.pick_folder !== "function") return "";
      const picked = await api.pick_folder(start || "");
      return String(picked || "");
    } catch (err) {
      return "";
    }
  }

  function showCwdModal() {
    state.modalKind = "cwd";
    openModal("会话工作目录", "", `<button id="modal-close">关闭</button>`);
    $("#modal-close").onclick = closeModal;
    const body = $("#modal-body");
    body.innerHTML = "";

    const grid = el("div", "form-grid");
    const row = el("div", "form-row");
    const label = el("label");
    label.htmlFor = "cwd-input";
    label.textContent = "工作目录（绝对路径）";
    const inline = el("div", "cfg-inline");
    const input = el("input", "form-input");
    input.id = "cwd-input";
    input.type = "text";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.placeholder = "/Users/you/project";
    input.value = state.cwd || "";
    const pick = el("button");
    pick.id = "cwd-pick";
    pick.type = "button";
    pick.textContent = "选择…";
    inline.appendChild(input);
    inline.appendChild(pick);
    const hint = el("div", "form-hint");
    hint.textContent = "留空表示不绑定项目。文件工具只接受绝对路径；未选择时写入仅限会话目录或经审批。";
    row.appendChild(label);
    row.appendChild(inline);
    row.appendChild(hint);
    grid.appendChild(row);
    body.appendChild(grid);

    const status = el("div", "cwd-status");
    status.id = "cwd-status";
    body.appendChild(status);

    const actions = el("div", "cwd-actions");
    const clear = el("button");
    clear.id = "cwd-clear";
    clear.type = "button";
    clear.textContent = "清除";
    const spacer = el("span", "spacer");
    const save = el("button", "primary");
    save.id = "cwd-save";
    save.type = "button";
    save.textContent = "保存";
    actions.appendChild(clear);
    actions.appendChild(spacer);
    actions.appendChild(save);
    body.appendChild(actions);

    function saveCwd() {
      if (state.busy) {
        status.textContent = "当前回复未结束，稍后再切换工作目录";
        return;
      }
      const path = input.value.trim();
      if (path && !path.startsWith("/") && !path.startsWith("~")
          && !/^[A-Za-z]:[\\/]/.test(path)) {
        status.textContent = "只支持绝对路径：以 / 或 ~ 开头";
        return;
      }
      if (!send({ type: "cwd", path })) {
        status.textContent = "未连接到后端，工作目录未修改";
        return;
      }
      closeModal();
    }

    input.addEventListener("input", () => { status.textContent = ""; });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        saveCwd();
      }
    });
    pick.onclick = async () => {
      pick.disabled = true;
      try {
        const picked = await pickFolder(input.value.trim());
        if (picked) {
          input.value = picked;
          status.textContent = "";
        }
      } finally {
        pick.disabled = false;
      }
    };
    save.onclick = saveCwd;
    clear.onclick = () => {
      input.value = "";
      saveCwd();
    };
    setTimeout(() => input.focus(), 40);
  }

  // 从设置进入的子面板都补一个「返回设置」，避免只能关掉重开
  function openFromSettings(openFn) {
    openFn();
    // 子面板可能因为「正在回复」等原因没有打开，此时别给设置列表添返回按钮
    if (state.modalKind === "settings") return;

    const back = el("button");

  function leaveSettingsChild() {
    if (state.modalKind === "config") {
      // JSON 标签页的草稿要先写回 state.config，否则返回会丢掉用户输入
      if (state.configTab === "json" && !commitConfigPane()) return;
      if (configDirty()) {
        state.configConfirmBack = true;
        renderConfigModal();
        return;
      }
    }
    openSettingsModal();
  }

  function configDirty() {
    if (!state.config || !state.configBaseline) return false;
    if (state.configTab === "json") {
      const area = $("#cfg-json");
      if (!area) return false;
      try {
        return JSON.stringify(JSON.parse(area.value)) !== state.configBaseline;
      } catch (err) {
        return true;
      }
    }
    return JSON.stringify(state.config) !== state.configBaseline;
  }

  function openTasksModal() {
    state.modalKind = "tasks";

      `<button id="modal-close">关闭</button>`);
    $("#modal-body").classList.add("tasks-body");
    $("#modal-body").innerHTML =
      `<div class="tasks-toolbar">` +
        `<div class="seg" role="tablist" aria-label="任务范围">` +
          `<button id="tasks-scope-session" class="seg-btn" role="tab">当前会话</button>` +
          `<button id="tasks-scope-all" class="seg-btn" role="tab">全部会话</button>` +
        `</div>` +
        `<span id="tasks-count" class="tasks-count"></span>` +
      `</div>` +

      `<div id="tasks-pager" class="tasks-pager hidden">` +

    $("#tasks-scope-session").onclick = () => switchTasksScope(false);
