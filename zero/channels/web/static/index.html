  function renderTasksScope() {
    const sessionBtn = $("#tasks-scope-session");
    const allBtn = $("#tasks-scope-all");
    if (!sessionBtn || !allBtn) return;
    sessionBtn.classList.toggle("active", !state.tasksAll);
    allBtn.classList.toggle("active", state.tasksAll);
    sessionBtn.setAttribute("aria-selected", String(!state.tasksAll));
    allBtn.setAttribute("aria-selected", String(state.tasksAll));
  }

  function switchTasksScope(all) {
    if (state.tasksAll === all) return;
    state.tasksAll = all;
    state.tasksPage = 0;
    renderTasksScope();
    requestTasks();
  }

  function requestTasks() {
    clearTimeout(state.tasksTimer);
    const btn = $("#tasks-refresh");
    if (btn) btn.disabled = true;
    const list = $("#tasks-list");
    if (list) list.innerHTML = tasksSkeletonHtml();
    const pager = $("#tasks-pager");
    if (pager) pager.classList.add("hidden");
    state.tasksTimer = setTimeout(() => {
        if (state.modalKind === "tasks") showTasksError("加载超时，请检查后端状态");
    }, 8000);
    if (!send({ type: "tasks", all: state.tasksAll })) {
      clearTimeout(state.tasksTimer);
      state.tasksTimer = 0;
      showTasksError("未连接到后端");
    }
  }

  function tasksSkeletonHtml() {
    const line = (w) => `<div class="sk" style="height:10px;width:${w};margin:7px 0"></div>`;
    return `<div style="padding:4px 0">${line("38%")}${line("82%")}${line("64%")}` +
      `${line("30%")}${line("76%")}</div>`;
  }

  function showTasksError(text) {
    if (state.modalKind !== "tasks") return;
    const btn = $("#tasks-refresh");
    if (btn) btn.disabled = false;
    const list = $("#tasks-list");
    if (!list) return;
    list.innerHTML =
      `<div class="modal-state">${icon("alert")}` +
      `<div>${escapeHtml(text)}</div>` +
      `<button id="tasks-retry">${icon("refresh")}<span>重试</span></button></div>`;
    $("#tasks-retry").onclick = () => requestTasks();
  }

  function renderTasksModal() {
    const STATUS_LABELS = {
      pending: "等待中",
      running: "进行中",
      completed: "已完成",
      failed: "失败",
      cancelled: "已取消",
    };
    const btn = $("#tasks-refresh");
    if (btn) btn.disabled = false;
    const list = $("#tasks-list");
    if (!list) return;
    list.innerHTML = "";
    const items = state.tasksItems;
    const count = $("#tasks-count");
    if (count) count.textContent = items.length ? `共 ${items.length} 项` : "";
    if (items.length === 0) {
      const hint = state.tasksAll ? "暂无定时任务" : "当前会话暂无定时任务";
      list.innerHTML =
        `<div class="modal-state">${icon("clock")}<div>${hint}</div></div>`;
      const pager = $("#tasks-pager");
      if (pager) pager.classList.add("hidden");
      return;
    }
    const pages = Math.max(1, Math.ceil(items.length / TASKS_PAGE_SIZE));
    if (state.tasksPage > pages - 1) state.tasksPage = pages - 1;
    const start = state.tasksPage * TASKS_PAGE_SIZE;
    items.slice(start, start + TASKS_PAGE_SIZE).forEach((task) => {
      const item = el("div", "task-item");
      const head = el("div", "task-head");
      const status = el("span", "task-status s-" + String(task.status || "pending"));
      status.textContent = STATUS_LABELS[task.status] || task.status || "等待中";
      head.appendChild(status);
      const meta = el("span", "task-meta");
      const next = task.triggerAt ? " · 下次 " + task.triggerAt : "";
      const cron = task.cron ? " · " + task.cron : "";
      const session = state.tasksAll && task.sessionId
        ? " · 会话 " + String(task.sessionId).slice(0, 8) : "";
      meta.textContent =
        `${task.scheduleType || ""}${next}${cron}${session} · ${String(task.id).slice(0, 8)}`;
      head.appendChild(meta);
      const text = el("div", "task-text");
      text.textContent = task.instruction;
      item.appendChild(head);
      item.appendChild(text);
      list.appendChild(item);
    });
    const pager = $("#tasks-pager");
    if (pager) pager.classList.toggle("hidden", pages <= 1);
    $("#tasks-page-info").textContent = `${state.tasksPage + 1} / ${pages}`;
    $("#tasks-prev").disabled = state.tasksPage <= 0;
    $("#tasks-next").disabled = state.tasksPage >= pages - 1;
  }

  function changeTasksPage(delta) {
    const pages = Math.max(1,
      Math.ceil(state.tasksItems.length / TASKS_PAGE_SIZE));
    const next = Math.min(pages - 1,
      Math.max(0, state.tasksPage + delta));
    if (next === state.tasksPage) return;
    state.tasksPage = next;
    renderTasksModal();
    const list = $("#tasks-list");
    if (list) list.scrollTop = 0;
  }

  /* ================= config / setup ================= */

  const MASKED_SECRET = "****";
  /* apiBase 会被原样当作 POST URL，所以预设必须是**完整端点**
     （含 /chat/completions）。只给基址会让每个请求 404。 */
  const PROVIDER_PRESETS = {
    deepseek: "https://api.deepseek.com/chat/completions",
    dashscope: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",
    zhipu: "https://open.bigmodel.cn/api/paas/v4/chat/completions",
  };
  const PROVIDER_LABELS = {
    deepseek: "DeepSeek",
    dashscope: "阿里云 DashScope",
    zhipu: "智谱 GLM",
  };
  const SETUP_REASONS = {
    missing: "首次使用：填写模型接入信息后才能开始对话",
    unbound: "配置里还没有可用的模型绑定，补齐后即可开始",
    invalid: "配置文件无法解析，请先备份并重置",
  };

  function deepCopy(value) {
    return JSON.parse(JSON.stringify(value === undefined ? null : value));
  }

  function setupVisible() {
    return !$("#setup").classList.contains("hidden");
  }

  function applySetup(setup) {
    state.setup = setup;
    if (!setup.required) {
      // 已保存待重启：仍然保持引导页盖住主界面，避免用旧配置继续对话
      if (state.configSaved) return;
      if (setupVisible()) $("#setup").classList.add("hidden");
      return;
    }
    hideSplash();
    // 已打开时保留用户已填写的内容，状态广播不能重置表单
    if (setupVisible()) return;
    openSetup(setup);
  }

  function openSetup(setup) {
    $("#setup").classList.remove("hidden");
    $("#setup-path").textContent = setup.configPath || "";
    $("#setup-sub").textContent =
      SETUP_REASONS[setup.reason] || "填写模型接入信息后才能开始使用";
    setConfigStatus("setup", "", "");
    const body = $("#setup-body");
    body.innerHTML = "";
    const broken = setup.reason === "invalid";
    $("#setup-test").disabled = broken;
    $("#setup-save").disabled = broken;
    if (broken) {
      body.appendChild(issueList(setup.issues || []));
      const reset = el("button");
      reset.textContent = "备份并重置为默认配置";
      reset.onclick = () => {
        reset.disabled = true;
        reset.textContent = "重置中…";
        send({ type: "config", op: "reset" });
      };
      body.appendChild(reset);
      return;
    }
    body.innerHTML = '<div class="modal-note">读取配置…</div>';
    send({ type: "config" });
  }

  function issueList(issues) {
    const list = el("ul", "issue-list");
    (issues || []).forEach((issue) => {
      const li = el("li");
      if (issue.path) {
        const code = el("code");
        code.textContent = issue.path;
        li.appendChild(code);
      }
      li.appendChild(document.createTextNode(issue.message || "配置不合法"));
      list.appendChild(li);
    });
    return list;
  }

  function fieldRow(labelText, input, hint, required) {
    const row = el("div", "form-row");
    const label = el("label");
    label.textContent = labelText;
    if (required) {
      const star = el("span", "cfg-req");
      star.textContent = "*";
      label.appendChild(star);
    }
    row.appendChild(label);
    row.appendChild(input);
    if (hint) {
      const tip = el("div", "form-hint");
      tip.textContent = hint;
      row.appendChild(tip);
    }
    return row;
  }

  function formInput(id, type, placeholder) {
    const input = el("input", "form-input");
    input.id = id;
    input.type = type || "text";
    if (placeholder) input.placeholder = placeholder;
    input.autocomplete = "off";
    return input;
  }

  function buildConfigFields(container, prefix, doc) {
    const providers = Object.keys(doc.providers || {});
    const models = Object.keys(doc.models || {});
    const def = (doc.agentRuntimes || {}).default || {};
    const opts = def.llmCallOptions || {};
    const currentModel = opts.model || models[0] || "deepseek-chat";
    const spec = (doc.models || {})[currentModel] || {};
    const currentProvider = providers.includes(spec.provider)
      ? spec.provider : (providers[0] || "deepseek");

    const provider = el("select", "form-input");
    provider.id = prefix + "-provider";
    // 默认厂商条目始终可选（即使配置里还没写入），再并上配置中已有的键
    const options = Array.from(new Set([...Object.keys(PROVIDER_PRESETS), ...providers]));
    options.forEach((key) => {
      const option = el("option");
      option.value = key;
      option.textContent = PROVIDER_LABELS[key] || key;
      provider.appendChild(option);
    });
    provider.value = currentProvider;
    const customOption = el("option");
    customOption.value = "__custom__";
    customOption.textContent = "自定义…";
    provider.appendChild(customOption);

    const customKey = formInput(
      prefix + "-provider-name", "text", "如 openrouter / my-proxy");
    const customRow = fieldRow(
      "Provider 标识", customKey,
      "字母、数字、下划线、中划线；例如 openrouter", true);
    customRow.classList.add("hidden");

    const saved = (doc.providers || {})[currentProvider] || {};
    const base = formInput(
      prefix + "-base", "text", "https://api.example.com/v1/chat/completions");
    base.value = saved.apiBase || PROVIDER_PRESETS[currentProvider] || "";
    const key = formInput(
      prefix + "-key", "password",
      saved.apiKey === MASKED_SECRET ? "已保存，留空则不修改" : "填写 API Key");
    const model = formInput(prefix + "-model", "text", "deepseek-chat");
    model.value = currentModel;
    const win = formInput(prefix + "-window", "number");
    win.min = "1";
    win.value = String(spec.contextWindowTokens || 65536);

    const grid = el("div", "form-grid");
    grid.appendChild(fieldRow("Provider", provider));
    grid.appendChild(customRow);
    grid.appendChild(fieldRow(
      "API Base", base,
      "完整端点，需含 /chat/completions（程序不会自动补全）"));
    grid.appendChild(fieldRow(
      "API Key", key, "只写入本地 config.json，界面回显始终是占位符"));
    const modelRow = el("div", "form-split");
    modelRow.appendChild(fieldRow("模型名", model));
    modelRow.appendChild(fieldRow("上下文窗口（tokens）", win));
    grid.appendChild(modelRow);
    container.appendChild(grid);

    provider.onchange = () => {
      const custom = provider.value === "__custom__";
      customRow.classList.toggle("hidden", !custom);
      const pick = custom ? {} : ((doc.providers || {})[provider.value] || {});
      base.value = pick.apiBase || PROVIDER_PRESETS[provider.value] || "";
      key.value = "";
      key.placeholder = pick.apiKey === MASKED_SECRET
        ? "已保存，留空则不修改" : "填写 API Key";
      if (custom) customKey.focus();
    };
    return { provider, customKey, base, key, model, win };
  }

  function collectConfigDoc(prefix) {
    const picked = $("#" + prefix + "-provider").value;
    const customInput = $("#" + prefix + "-provider-name");
    const provider = picked === "__custom__"
      ? (customInput ? customInput.value.trim() : "") : picked;
    if (!provider) throw new Error("请填写 Provider 标识");
    if (!PROVIDER_KEY_RE.test(provider)) {
      throw new Error("Provider 标识只能包含字母、数字、下划线和中划线");
    }
    const apiBase = $("#" + prefix + "-base").value.trim();
    const apiKey = $("#" + prefix + "-key").value.trim();
    const model = $("#" + prefix + "-model").value.trim();
    const windowTokens = Number($("#" + prefix + "-window").value);
    if (!apiBase) throw new Error("请填写 API Base");
    if (!model) throw new Error("请填写模型名");
    if (!Number.isFinite(windowTokens) || windowTokens <= 0) {
      throw new Error("上下文窗口必须是正整数");
    }
    const doc = deepCopy(state.config || {});
    doc.providers = doc.providers || {};
    const previous = doc.providers[provider] || {};
    doc.providers[provider] = {
      ...previous,
      apiBase,
      apiKey: apiKey || (previous.apiKey === MASKED_SECRET ? MASKED_SECRET : ""),
    };
    doc.models = doc.models || {};
    doc.models[model] = {
      ...(doc.models[model] || {}),
      provider,
      contextWindowTokens: windowTokens,
    };
    doc.agentRuntimes = doc.agentRuntimes || {};
    doc.agentRuntimes.default = doc.agentRuntimes.default || {};
    doc.agentRuntimes.default.llmCallOptions = {
      ...(doc.agentRuntimes.default.llmCallOptions || {}),
      model,
    };
    return doc;
  }

  /* ---------- schema 驱动的完整配置表单（设置页“常用”） ---------- */

  const RUNTIME_TASKS = [
    { key: "default", label: "default（主对话，必填）", required: true },
    { key: "compact", label: "compact（上下文压缩）" },
    { key: "session_summary", label: "session_summary（会话复盘）" },
    { key: "memory", label: "memory（记忆沉淀）" },
    { key: "subagent", label: "subagent（子 agent）" },
  ];

  function readPath(root, path) {
    let cur = root;
    for (const key of path) {
      if (cur === null || typeof cur !== "object") return undefined;
      cur = cur[key];
    }
    return cur;
  }

  function writePath(root, path, value) {
    let cur = root;
    for (let i = 0; i < path.length - 1; i += 1) {
      const key = path[i];
      if (cur[key] === null || typeof cur[key] !== "object") cur[key] = {};
      cur = cur[key];
    }
    cur[path[path.length - 1]] = value;
  }

  function deletePath(root, path) {
    let cur = root;
    for (let i = 0; i < path.length - 1; i += 1) {
      const key = path[i];
      if (cur[key] === null || typeof cur[key] !== "object") return;
      cur = cur[key];
    }
    delete cur[path[path.length - 1]];
  }

  function cfgSection(container, title, desc, open) {
    const box = el("details", "cfg-section");
    box.open = !!open;
    const head = el("summary", "cfg-sec-head");
    const name = el("span");
    name.textContent = title;
    const note = el("span", "cfg-sec-desc");
    note.textContent = desc || "";
    const caret = el("span");
    caret.innerHTML = icon("chevron", "cfg-sec-caret");
    head.appendChild(name);
    head.appendChild(note);
    head.appendChild(caret);
    box.appendChild(head);
    const body = el("div", "cfg-sec-body");
    box.appendChild(body);
    container.appendChild(box);
    return body;
  }

  function cfgText(doc, path, opts) {
    const o = opts || {};
    const input = el("input", "form-input");
    if (o.numeric) input.type = "number";
    if (o.min !== undefined) input.min = String(o.min);
    if (o.max !== undefined) input.max = String(o.max);
    if (o.step !== undefined) input.step = String(o.step);
    if (o.placeholder) input.placeholder = o.placeholder;
    const current = readPath(doc, path);
    input.value = current === undefined || current === null ? "" : String(current);
    input.oninput = () => {
      const raw = input.value.trim();
      if (!raw) {
        // 清空 = 不写入该键（继承 default / 使用默认值）；必填项保留空串让后端报错
        if (o.keepEmpty) writePath(doc, path, "");
        else deletePath(doc, path);
        return;
      }
      if (o.numeric) {
        const num = Number(raw);
        if (!Number.isFinite(num)) return;
        writePath(doc, path, o.integer ? Math.trunc(num) : num);
      } else {
        writePath(doc, path, raw);
      }
    };
    return input;
  }

  function cfgList(doc, path) {
    const input = el("input", "form-input");
    input.placeholder = "逗号分隔，例如 a, b";
    const current = readPath(doc, path);
    input.value = Array.isArray(current) ? current.join(", ") : "";
    input.oninput = () => {
      const items = input.value.split(",").map((s) => s.trim()).filter(Boolean);
      if (!items.length) deletePath(doc, path);
      else writePath(doc, path, items);
    };
    return input;
  }

  function cfgJson(doc, path) {
    const area = el("textarea", "form-input cfg-json-field");
    area.rows = 3;
    area.spellcheck = false;
    area.placeholder = "JSON；留空 = 不写入";
    const current = readPath(doc, path);
    area.value = current === undefined ? "" : JSON.stringify(current, null, 2);
    area.oninput = () => {
      const raw = area.value.trim();
      area.classList.remove("bad");
      if (!raw) {
        deletePath(doc, path);
        return;
      }
      try {
        writePath(doc, path, JSON.parse(raw));
      } catch (err) {
        area.classList.add("bad");
      }
    };
    return area;
  }

  function cfgSecret(doc, path) {
    const wrap = el("div", "cfg-inline");
    const input = el("input", "form-input");
    input.type = "password";
    input.autocomplete = "off";
    const current = readPath(doc, path);
    const masked = current === MASKED_SECRET;
    input.placeholder = masked ? "已保存，留空则不修改" : "填写密钥";
    input.oninput = () => {
      const raw = input.value.trim();
      if (!raw) {
        if (masked) writePath(doc, path, MASKED_SECRET);
        else deletePath(doc, path);
        return;
      }
      writePath(doc, path, raw);
    };
    const clear = el("button", "cfg-del");
    clear.type = "button";
    clear.textContent = "清除";
    clear.title = "清空该密钥";
    clear.onclick = () => {
      writePath(doc, path, "");
      input.value = "";
      input.placeholder = "填写密钥";
    };
    wrap.appendChild(input);
    wrap.appendChild(clear);
    return wrap;
  }

  function cfgCheckbox(container, labelText, doc, path, fallback) {
    const wrap = el("label", "cfg-check");
    const input = el("input");
    input.type = "checkbox";
    const current = readPath(doc, path);
    input.checked = current === undefined ? !!fallback : !!current;
    input.onchange = () => writePath(doc, path, input.checked);
    const text = el("span");
    text.textContent = labelText;
    wrap.appendChild(input);
    wrap.appendChild(text);
    container.appendChild(wrap);
    return input;
  }

  function cfgInheritedRuntime(doc, taskKey) {
    const runtimes = doc.agentRuntimes || {};
    const def = runtimes.default || {};
    const task = runtimes[taskKey] || {};
    const merge = (base, over) => Object.assign({}, base || {}, over || {});
    const opts = merge(
      merge({ temperature: 0.1, maxTokens: 8192 }, def.llmCallOptions),
      task.llmCallOptions);
    return {
      maxIterations: task.maxIterations ?? def.maxIterations ?? 50,
      reasoningTokenHeadroom:
        task.reasoningTokenHeadroom ?? def.reasoningTokenHeadroom ?? 4096,
      model: opts.model || "",
      temperature: opts.temperature,
      maxTokens: opts.maxTokens,
    };
  }

  function cfgRuntimeFields(grid, doc, taskKey, isDefault) {
    const inherited = cfgInheritedRuntime(doc, taskKey);
    const prefix = isDefault ? "默认" : "继承 default";

    const ph = (value) => `${prefix}：${value}`;

    grid.appendChild(fieldRow(
      "maxIterations",
      cfgText(doc, path(["maxIterations"]),
        { numeric: true, integer: true, min: 1, placeholder: ph(inherited.maxIterations) })));
    grid.appendChild(fieldRow(
      "reasoningTokenHeadroom",
      cfgText(doc, path(["reasoningTokenHeadroom"]),
        { numeric: true, integer: true, min: 0, placeholder: ph(inherited.reasoningTokenHeadroom) })));
    grid.appendChild(fieldRow(
      "llmCallOptions.model",
      cfgText(doc, path(["llmCallOptions", "model"]),
        { placeholder: isDefault ? "必填：models 注册表中的键" : ph(inherited.model || "未设置") }),
      isDefault ? "主对话必须绑定 models 里的模型键" : "留空 = 跟随 default",
      isDefault));
    grid.appendChild(fieldRow(
      "temperature",
      cfgText(doc, path(["llmCallOptions", "temperature"]),
        { numeric: true, min: 0, max: 2, step: 0.1, placeholder: ph(inherited.temperature) })));
    grid.appendChild(fieldRow(
      "maxTokens",
      cfgText(doc, path(["llmCallOptions", "maxTokens"]),
        { numeric: true, integer: true, min: 1, placeholder: ph(inherited.maxTokens) })));
    grid.appendChild(fieldRow(
      "reasoningEffort",
      cfgText(doc, path(["llmCallOptions", "reasoningEffort"]), { placeholder: "留空 = 不写入" })));
    grid.appendChild(fieldRow(
      "stop",
      cfgList(doc, path(["llmCallOptions", "stop"])),
      "数组；留空 = 不写入"));

    const adv = el("details", "cfg-section");
    const advHead = el("summary", "cfg-sec-head");
    const advName = el("span");
    advName.textContent = "高级调用选项";
    const advDesc = el("span", "cfg-sec-desc");
    advDesc.textContent = "JSON 字段：留空表示不写入";
    const advCaret = el("span");
    advCaret.innerHTML = icon("chevron", "cfg-sec-caret");
    advHead.appendChild(advName);
    advHead.appendChild(advDesc);
    advHead.appendChild(advCaret);
    adv.appendChild(advHead);
    const advBody = el("div", "cfg-sec-body");
    const advGrid = el("div", "form-grid");
    advGrid.appendChild(fieldRow(
      "toolChoice",
      cfgJson(doc, path(["llmCallOptions", "toolChoice"]))));
    advGrid.appendChild(fieldRow(
      "responseFormat",
      cfgJson(doc, path(["llmCallOptions", "responseFormat"]))));
    advGrid.appendChild(fieldRow(
      "streamOptions",
      cfgJson(doc, path(["llmCallOptions", "streamOptions"]))));
    advGrid.appendChild(fieldRow(
      "extraBody",
      cfgJson(doc, path(["llmCallOptions", "extraBody"]))));
    advGrid.appendChild(fieldRow(
      "stream",
      cfgStreamSelect(doc, path(["llmCallOptions", "stream"])),
      "三态：未写入 / true / false"));
    advBody.appendChild(advGrid);
    adv.appendChild(advBody);
    grid.appendChild(adv);
  }

  function cfgStreamSelect(doc, path) {
    const select = el("select", "form-input");
    [["", "未写入（跟随默认）"], ["true", "true"], ["false", "false"]]
      .forEach(([value, label]) => {
        const option = el("option");
        option.value = value;
        option.textContent = label;
        select.appendChild(option);
      });
    const current = readPath(doc, path);
    select.value = current === undefined || current === null ? "" : String(current);
    select.onchange = () => {
      if (select.value === "") deletePath(doc, path);
      else writePath(doc, path, select.value === "true");
    };
    return select;
  }

  function cfgProviderSelect(doc, name) {
    const keys = Object.keys(doc.providers || {});
    const current = readPath(doc, ["models", name, "provider"]) || "";
    const select = el("select", "form-input");
    const blank = el("option");
    blank.value = "";
    blank.textContent = keys.length ? "选择 provider" : "先添加 provider";
    select.appendChild(blank);
    keys.forEach((key) => {
      const option = el("option");
      option.value = key;
      option.textContent = key;
      select.appendChild(option);
    });
    if (current && !keys.includes(current)) {
      const missing = el("option");
      missing.value = current;
      missing.textContent = `${current}（未配置）`;
      select.appendChild(missing);
    }
    select.value = current;
    select.onchange = () => {
      writePath(doc, ["models", name, "provider"], select.value);
    };
    return select;
  }

  function cfgModelsSection(container, doc, rerender) {
    const body = cfgSection(
      container, "models",
      "模型注册表：键为 API 模型名，至少一项；被 agentRuntimes 引用。", true);
    doc.models = doc.models || {};
    const names = Object.keys(doc.models);
    if (!names.length) {
      const note = el("div", "cfg-note");
      note.textContent = "还没有模型：至少注册一个，并把 default.llmCallOptions.model 指向它。";
      body.appendChild(note);
    }
    names.forEach((name) => {
      const row = el("div", "cfg-map-row");
      const nameInput = el("input", "form-input");
      nameInput.value = name;
      nameInput.onchange = () => {
        const next = nameInput.value.trim();
        if (!next || next === name || doc.models[next]) {
          nameInput.value = name;
          return;
        }
        const value = doc.models[name];
        delete doc.models[name];
        doc.models[next] = value;
        rerender();
      };
      row.appendChild(fieldRow("模型名", nameInput));
      row.appendChild(fieldRow(
        "provider",
        cfgProviderSelect(doc, name),
        "", true));
      row.appendChild(fieldRow(
        "contextWindowTokens",
        cfgText(doc, ["models", name, "contextWindowTokens"],
          { numeric: true, integer: true, min: 1 }),
        "", true));
      const del = el("button", "cfg-del");
      del.type = "button";
      del.textContent = "删除";
      del.onclick = () => {
        delete doc.models[name];
        rerender();
      };
      row.appendChild(del);
      body.appendChild(row);
    });
    const add = el("button", "cfg-add");
    add.type = "button";
    add.textContent = "+ 添加模型";
    add.onclick = () => {
      let i = 1;
      let key = `model-${i}`;
      while (doc.models[key]) {
        i += 1;
        key = `model-${i}`;
      }
      doc.models[key] = { provider: "", contextWindowTokens: 0 };
      rerender();

  function cfgRuntimesSection(container, doc, rerender) {
    const body = cfgSection(
      container, "agentRuntimes",
      "按任务覆盖运行时；未填写的字段继承 default。", true);
    doc.agentRuntimes = doc.agentRuntimes || {};
    doc.agentRuntimes.default = doc.agentRuntimes.default || {};
    RUNTIME_TASKS.forEach((task) => {
      const isDefault = task.key === "default";
      const entry = doc.agentRuntimes[task.key];
      const sub = el("div", "cfg-sub");
      const head = el("div", "cfg-sub-head");
      const title = el("div", "cfg-sub-title");
      title.textContent = task.label;
      head.appendChild(title);
      if (!isDefault) {
        const toggle = el("label", "cfg-check");
        const box = el("input");
        box.type = "checkbox";
        box.checked = entry !== undefined && entry !== null;
        const text = el("span");
        text.textContent = "覆盖 default";
        box.onchange = () => {
          if (box.checked) writePath(doc, ["agentRuntimes", task.key], {});
          else delete doc.agentRuntimes[task.key];
          rerender();
        };
        toggle.appendChild(box);
        toggle.appendChild(text);
        head.appendChild(toggle);
      }
      sub.appendChild(head);
      if (isDefault || (entry !== undefined && entry !== null)) {
        const grid = el("div", "form-grid");
        cfgRuntimeFields(grid, doc, task.key, isDefault);
        sub.appendChild(grid);
      }
      body.appendChild(sub);
    });
  }

  const PROVIDER_KEY_RE = /^[A-Za-z0-9_-]+$/;

  function cfgProvidersSection(container, doc, rerender) {
    const body = cfgSection(
      container, "providers",
      "厂商接入信息：键可自定义（字母/数字/_/-），被 models 引用的 provider 必须填写 "
      + "apiBase（完整端点，需含 /chat/completions，程序不会自动补全）。",
      false);
    doc.providers = doc.providers || {};
    const used = new Set(
      Object.values(doc.models || {}).map((m) => m && m.provider).filter(Boolean));
    Object.keys(doc.providers).forEach((key) => {
      const card = el("div", "cfg-provider");
      const nameInput = el("input", "form-input");
      nameInput.value = key;
      nameInput.onchange = () => {
        const next = nameInput.value.trim();
        if (!next || next === key || doc.providers[next]
            || !PROVIDER_KEY_RE.test(next)) {
          nameInput.value = key;
          return;
        }
        const value = doc.providers[key];
        delete doc.providers[key];
        doc.providers[next] = value;
        // provider 改名时同步 models 里的引用，避免出现悬空键
        Object.values(doc.models || {}).forEach((spec) => {
          if (spec && spec.provider === key) spec.provider = next;
        });
        rerender();
      };
      const del = el("button", "cfg-del");
      del.type = "button";
      del.textContent = "删除";
      // 仍被模型引用时不允许删除，避免保存后出现悬空 provider
      del.disabled = used.has(key);
      if (del.disabled) del.title = "仍被 models 引用：先把模型的 provider 改到别处";
      del.onclick = () => {
        delete doc.providers[key];
        rerender();
      };
      // 标识与删除同处一行，删除紧贴控件，不漂浮到卡片右缘
      const nameRow = el("div", "form-row");
      const nameLabel = el("label");
      nameLabel.textContent = "provider 标识";
      const star = el("span", "cfg-req");
      star.textContent = "*";
      nameLabel.appendChild(star);
      const nameLine = el("div", "cfg-inline");
      nameLine.appendChild(nameInput);
      nameLine.appendChild(del);
      nameRow.appendChild(nameLabel);
      nameRow.appendChild(nameLine);
      card.appendChild(nameRow);

      const line = el("div", "form-split");
      line.appendChild(fieldRow(
        "apiBase",
        cfgText(doc, ["providers", key, "apiBase"],
          { placeholder: "https://api.example.com/v1/chat/completions" }),
        used.has(key) ? "已被 models 引用，必填（含 /chat/completions 的完整端点）" : "",
        used.has(key)));
      line.appendChild(fieldRow(
        "apiKey",
        cfgSecret(doc, ["providers", key, "apiKey"])));
      card.appendChild(line);
      body.appendChild(card);
    });
    const add = el("button", "cfg-add");
    add.type = "button";
    add.textContent = "+ 添加 Provider";
    add.onclick = () => {
      let i = 1;
      let key = `provider-${i}`;
      while (doc.providers[key]) {
        i += 1;
        key = `provider-${i}`;
      }
      doc.providers[key] = { apiBase: "", apiKey: "" };
      rerender();
    };
    body.appendChild(add);
  }

    state.modalKind = "permission";

    state.permissionOp = "";
    openModal("权限", "", `<button id="modal-close">关闭</button>`);

  function onPermission(msg) {
    // 快照缺失（读取失败）时保留上一次结果，避免面板被清空
    state.permission = msg.snapshot || state.permission;
    state.permissionBusy = false;
    state.permissionError = msg.ok === false ? (msg.error || "操作失败") : "";
    // 成功后清空对应的输入草稿；失败时保留，用户改一处即可重试
    if (msg.ok !== false && state.permissionOp === "add-root") {
      state.permissionDraft.root = "";
    }
    if (msg.ok !== false && state.permissionOp === "add-unsandbox") {
      state.permissionDraft.unsandbox = "";
    }
    state.permissionOp = "";
    if (state.modalKind === "permission") renderPermissionModal();
  }

  function permSend(op, extra) {
    if (state.permissionBusy) return;
    state.permissionBusy = true;
    state.permissionOp = op;
    const status = $("#perm-status");
    if (status) status.textContent = "处理中…";
    if (!send(Object.assign({ type: "permission", op }, extra || {}))) {
      state.permissionBusy = false;
      state.permissionOp = "";
      if (status) status.textContent = "未连接到后端，权限未修改";
    }
  }

  function permStatusRow(label, value, cls, hint) {
    const row = el("div", "perm-status-row");
    const key = el("span", "perm-key");
    key.textContent = label;
    const badge = el("span", "perm-badge " + cls);
    badge.textContent = value;
    row.appendChild(key);
    row.appendChild(badge);
    if (hint) {
      const note = el("span", "perm-hint");
      note.textContent = hint;
      row.appendChild(note);
    }
    return row;
  }

  function permRow(text, onRemove) {
    const row = el("div", "perm-row");
    const label = el("span", "perm-path");
    label.textContent = text;
    label.title = text;
    const del = el("button", "perm-del");
    del.type = "button";
    del.textContent = "移除";
    del.onclick = onRemove;
    row.appendChild(label);
    row.appendChild(del);
    return row;
  }

  function permAddRow(placeholder, onAdd, withPicker, draftKey) {
    const box = el("div", "perm-add");
    const input = el("input", "form-input");
    input.placeholder = placeholder;
    input.autocomplete = "off";
    input.spellcheck = false;
    // 草稿跨重渲染保留：校验失败时不让用户重新输入
    input.value = state.permissionDraft[draftKey] || "";
    input.oninput = () => {
      state.permissionDraft[draftKey] = input.value;
    };
    box.appendChild(input);
    if (withPicker) {
      const pick = el("button");
      pick.type = "button";
      pick.textContent = "选择…";
      pick.onclick = async () => {
        const picked = await pickFolder(input.value.trim());
        if (picked) {
          input.value = picked;
          state.permissionDraft[draftKey] = picked;
        }
      };
      box.appendChild(pick);
    }
    const add = el("button", "primary");
    add.type = "button";
    add.textContent = "添加";
    add.onclick = () => {
      const value = input.value.trim();
      if (!value) {
        input.focus();
        return;
      }
      onAdd(value);
    };
    box.appendChild(add);
    return box;
  }

  // ------------------------------------------------------------------
  // 飞书通道
  // ------------------------------------------------------------------
  const FEISHU_STATE_TEXT = {
    unconfigured: "未配置",
    connecting: "连接中",
    connected: "已连接",
    failed: "连接失败",
    disabled: "已关闭",
  };

  function reflectFeishu(snap) {
    const btn = $("#feishu-status");
    if (!btn) return;
    // 只用颜色表达状态：灰=未启用/已关闭，橙=连接中，绿=已连接，红=失败
    btn.classList.remove("on", "wait", "bad");
    btn.title = "飞书未启用，点击查看";
    if (snap) {
      if (snap.state === "connected") {
        btn.classList.add("on");
        btn.title = "飞书已连接，点击查看";
      } else if (snap.state === "connecting") {
        btn.classList.add("wait");
        btn.title = "飞书连接中，点击查看";
      } else if (snap.state === "failed") {
        btn.classList.add("bad");
        btn.title = "飞书连接失败，点击处理";
      } else if (snap.state === "disabled") {
        btn.title = "飞书已关闭，点击查看";
      } else if (snap.state === "unconfigured") {
        btn.title = "飞书未配置，点击查看";
      }
    }
    btn.setAttribute("aria-label", btn.title);
  }

  function onFeishu(msg) {
    if (msg.op === "qr") {
      onFeishuQr(msg.qr || {});
      return;
    }
    if (msg.snapshot) state.feishu = msg.snapshot;
    state.feishuBusy = false;
    state.feishuError = msg.ok === false ? (msg.error || "操作失败") : "";
    reflectFeishu(state.feishu);
    if (state.modalKind === "feishu") renderFeishuModal();
  }

  function feishuSend(op) {
    if (state.feishuBusy) return;
    state.feishuBusy = true;
    state.feishuError = "";
    const note = $("#feishu-status-note");
    if (note) note.textContent = "处理中…";
    if (!send({ type: "feishu", op })) {
      state.feishuBusy = false;
      state.feishuError = "未连接到后端，开关未生效";
      if (state.modalKind === "feishu") renderFeishuModal();
    }
  }

  function openFeishuModal() {
    state.modalKind = "feishu";
    state.feishuBusy = false;
    state.feishuError = "";
    openModal("飞书通道", "", `<button id="modal-close">关闭</button>`);
    $("#modal-close").onclick = closeModal;
    renderFeishuModal();
    send({ type: "feishu" });
  }

  function renderFeishuModal() {
    const body = $("#modal-body");
    const snap = state.feishu;
    body.innerHTML = "";
    if (!snap) {
      const loading = el("div", "perm-empty");
      loading.textContent = "正在读取通道状态…";
      body.appendChild(loading);
      return;
    }

    const status = el("div", "perm-status");
    status.appendChild(permStatusRow(
      "凭据",
      snap.configured ? "已配置"
        : snap.restartRequired ? "已保存，重启后生效" : "未配置",
      snap.configured || snap.restartRequired ? "ok" : "bad"));
    const tone = snap.state === "connected" ? "ok"
      : snap.state === "failed" ? "bad"
        : "";
    status.appendChild(permStatusRow(
      "通道状态", FEISHU_STATE_TEXT[snap.state] || "未知", tone));
    body.appendChild(status);

    if (state.feishuError || snap.error) {
      const err = el("div", "perm-error");
      err.textContent = state.feishuError || snap.error;
      body.appendChild(err);
    }
    if (snap.restartRequired) {
      const ok = el("div", "perm-hint");
      ok.textContent = "扫码得到的凭据已保存。重启 zero 后会自动使用新凭据连接，"
        + "当前进程仍用启动时的配置。";
      body.appendChild(ok);
    } else if (snap.state === "unconfigured") {
      const warn = el("div", "perm-warn");
      const missing = (snap.missing || []).join("、");
      warn.textContent = (missing ? `缺少 ${missing}：` : "还没有飞书凭据：")
        + "可以点「扫码连接」自动创建，或到「配置 → channels → feishu」手动填写。";
      body.appendChild(warn);
    } else if (snap.state === "failed") {
      const hint = el("div", "perm-hint");
      hint.textContent = "如果刚改过飞书应用配置，请检查 appId 与 appSecret "
        + "是否正确；也可以直接重新连接。";
      body.appendChild(hint);
    }

    const foot = el("div", "config-foot");
    const addAction = (text, primary, handler) => {
      const btn = el("button", primary ? "primary" : "");
      btn.type = "button";
      btn.textContent = text;
      btn.disabled = state.feishuBusy;
      btn.onclick = handler;
      foot.appendChild(btn);
    };
    if (snap.restartRequired) {
      // 扫码保存的新凭据只有重启后才生效，这里直接给一键重启
      addAction("立即重启", true, beginRestart);
    }
    if (snap.state === "failed") {
      addAction("重新连接", !snap.restartRequired,
        () => feishuSend("reconnect"));
      addAction("去配置", false, () => openConfigModal("feishu"));
      addAction("扫码连接", false, () => openFeishuQrModal());
      addAction("停用", false, () => feishuSend("disable"));
    } else if (snap.state === "unconfigured") {
      addAction("扫码连接", !snap.restartRequired, () => openFeishuQrModal());
      addAction("去配置", !snap.restartRequired,
        () => openConfigModal("feishu"));
    } else if (snap.state === "connecting" || snap.state === "connected") {
      addAction("停用", false, () => feishuSend("disable"));
      addAction("扫码连接", false, () => openFeishuQrModal());
    } else {
      addAction("启用", !snap.restartRequired, () => feishuSend("enable"));
      addAction("扫码连接", false, () => openFeishuQrModal());
    }
    const refresh = el("button");
    refresh.type = "button";
    refresh.textContent = "刷新";
    refresh.disabled = state.feishuBusy;
    refresh.onclick = () => {
      state.feishuError = "";
      send({ type: "feishu" });
    };
    foot.appendChild(refresh);
    const note = el("span", "setup-status");
    note.id = "feishu-status-note";
    note.textContent = state.feishuBusy
      ? "处理中…"
      : "开关会写入 channels.feishu.enabled，立即生效";
    foot.appendChild(note);
    body.appendChild(foot);
  }

  // ------------------------------------------------------------------
  // 扫码连接飞书（设备授权码流程）
  // ------------------------------------------------------------------

  function openFeishuQrModal() {
    state.modalKind = "feishu-qr";
    state.feishuQr = { phase: "starting" };
    stopQrCountdown();
    openModal("扫码连接飞书", "", `<button id="modal-close">关闭</button>`);
    $("#modal-close").onclick = closeModal;
    renderFeishuQrModal();
    if (!send({ type: "feishu", op: "qr-start" })) {
      state.feishuQr = { phase: "failed", text: "未连接到后端，无法开始扫码" };
      renderFeishuQrModal();
    }
  }

  function onFeishuQr(qr) {
    // 弹窗已关：忽略在途事件，后端收到 qr-cancel 会自行收尾
    if (state.modalKind !== "feishu-qr") return;
    state.feishuQr = qr || {};
    const waiting = state.feishuQr.phase === "waiting";
    if (!waiting && state.feishuQr.phase !== "starting") stopQrCountdown();
    // 先渲染出 #qr-count 再启动计时，否则第一次读秒会停在占位符
    renderFeishuQrModal();
    if (waiting) startQrCountdown(state.feishuQr.expireIn);
    if (qr && qr.phase === "success") toast(qr.text || "扫码成功", "info");
  }

  function stopQrCountdown() {
    if (state.qrTimer) {
      clearInterval(state.qrTimer);
      state.qrTimer = 0;
    }
  }

  function startQrCountdown(seconds) {
    stopQrCountdown();
    const total = Number(seconds) > 0 ? Number(seconds) : 600;
    state.qrExpireAt = Date.now() + total * 1000;
    const tick = () => {
      const node = $("#qr-count");
      const left = Math.max(
        0, Math.round((state.qrExpireAt - Date.now()) / 1000));
      if (node) {
        const mm = String(Math.floor(left / 60)).padStart(2, "0");
        const ss = String(left % 60).padStart(2, "0");
        node.textContent = `${mm}:${ss}`;
      }
      if (left <= 0) {
        stopQrCountdown();
        if (state.feishuQr && state.feishuQr.phase === "waiting") {
          state.feishuQr = {
            phase: "failed", text: "二维码已过期，请重新生成",
          };
          if (state.modalKind === "feishu-qr") renderFeishuQrModal();
        }
      }
    };
    state.qrTimer = setInterval(tick, 1000);
    tick();
  }

  function restartQr() {
    state.feishuQr = { phase: "starting" };
    stopQrCountdown();
    renderFeishuQrModal();
    send({ type: "feishu", op: "qr-start" });
  }

  function qrSvgMarkup(raw) {
    // 后端给的是完整 SVG 文档，开头带 <?xml ...?> 声明；直接塞进 innerHTML
    // 时 XML 声明会被当成一段注释/非法节点，WKWebView 下表现为整块空白。
    // 这里只截取 <svg>…</svg> 片段，既避开声明，也避免注入任意 HTML。
    const text = String(raw || "").trim();
    const start = text.indexOf("<svg");
    const end = text.lastIndexOf("</svg>");
    if (start < 0 || end <= start) return "";
    return text.slice(start, end + "</svg>".length);
  }

  function renderFeishuQrModal() {
    const body = $("#modal-body");
    const qr = state.feishuQr || {};
    body.innerHTML = "";
    const panel = el("div", "qr-panel");
    body.appendChild(panel);

    if (qr.phase === "waiting") {
      const svg = qrSvgMarkup(qr.svg);
      if (svg) {
        const box = el("div", "qr-box");
        box.innerHTML = svg;
        panel.appendChild(box);
      } else {
        // 不再留白框：直接说明失败原因，并把链接作为唯一可用入口
        const failed = el("div", "perm-error");
        failed.textContent = "二维码加载失败，可用下方链接";
        panel.appendChild(failed);
      }

      const meta = el("div", "qr-meta");
      meta.appendChild(document.createTextNode("二维码有效期："));
      const count = el("b");
      count.id = "qr-count";
      count.textContent = "--:--";
      meta.appendChild(count);
      panel.appendChild(meta);

      if (qr.url) {
        const link = el("a", "qr-open");
        link.href = qr.url;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "在飞书中打开";
        panel.appendChild(link);
      }

      const tip = el("div", "qr-tip");
      tip.textContent = "用飞书 App 扫一扫，在手机上确认。确认页可以新建应用，"
        + "也可以选择之前创建过的应用，本次所需权限会追加到它上面。";
      panel.appendChild(tip);
    } else if (qr.phase === "success") {
      const mark = el("div", "qr-mark");
      mark.textContent = "✓";
      panel.appendChild(mark);
      const text = el("div", "qr-meta");
      text.textContent = qr.text || "扫码成功";
      panel.appendChild(text);
      if (qr.appId) {
        const id = el("div", "qr-tip");
        id.textContent = `应用 appId：${qr.appId}`;
        panel.appendChild(id);
      }
      const tip = el("div", "qr-tip");
      tip.textContent = "新凭据只影响下次启动：当前进程继续使用启动时的配置。";
      panel.appendChild(tip);
    } else if (qr.phase === "failed") {
      const mark = el("div", "qr-mark bad");
      mark.textContent = "!";
      panel.appendChild(mark);
      const text = el("div", "perm-error");
      text.textContent = qr.text || "扫码失败，请重试";
      panel.appendChild(text);
    } else if (qr.phase === "cancelled") {
      const text = el("div", "qr-meta");
      text.textContent = qr.text || "已取消扫码";
      panel.appendChild(text);
    } else {
      const text = el("div", "qr-meta");
      text.textContent = "正在生成二维码…";
      panel.appendChild(text);
    }

    const foot = el("div", "config-foot");
    const addAction = (text, primary, handler) => {
      const btn = el("button", primary ? "primary" : "");
      btn.type = "button";
      btn.textContent = text;
      btn.onclick = handler;
      foot.appendChild(btn);
    };
    if (qr.phase === "waiting") {
      addAction("重新生成", false, restartQr);
      addAction("取消", false, closeModal);
    } else if (qr.phase === "failed" || qr.phase === "cancelled") {
      addAction("重新扫码", true, restartQr);
      addAction("取消", false, closeModal);
    } else if (qr.phase === "success") {
      addAction("立即重启", true, beginRestart);
      addAction("稍后重启", false, closeModal);
    } else {
      addAction("取消", false, closeModal);
    }
    body.appendChild(foot);
  }

  function renderConfigModal() {
    const body = $("#modal-body");
    // 增删模型 / 切换任务覆盖会触发重渲染：保留分区展开状态与滚动位置
    const openState = Array.from(body.querySelectorAll(".cfg-section"))
      .map((node) => node.open);
    const scrollTop = body.scrollTop;
    body.innerHTML = "";
    if (state.configConfirmBack) {
      // 返回设置前发现未保存修改：给出「继续编辑 / 放弃并返回」两个选择
      const bar = el("div", "settings-confirm");
      const text = el("span");
      text.textContent = "配置有未保存的修改，返回设置会丢弃这些改动。";
      const stay = el("button");
      stay.type = "button";
      stay.textContent = "继续编辑";
      stay.onclick = () => {
        state.configConfirmBack = false;
        renderConfigModal();
      };
      const leave = el("button", "primary");
      leave.type = "button";
      leave.textContent = "放弃并返回";
      leave.onclick = () => {
        state.configConfirmBack = false;
        openSettingsModal();
      };
      bar.appendChild(text);
      bar.appendChild(stay);
      bar.appendChild(leave);
      body.appendChild(bar);
    }
    const tabs = el("div", "seg config-tabs");
    [["form", "表单"], ["json", "JSON"]].forEach(([key, label]) => {
      const btn = el("button",
        "seg-btn" + (state.configTab === key ? " active" : ""));
      btn.textContent = label;
      btn.onclick = () => switchConfigTab(key);
      tabs.appendChild(btn);
    });
    body.appendChild(tabs);

    const pane = el("div");
    pane.id = "config-pane";
    body.appendChild(pane);
    if (state.configTab === "form") {
      renderConfigSections(pane, state.config || {}, () => renderConfigModal());
      Array.from(pane.querySelectorAll(".cfg-section")).forEach((node, i) => {
        if (i < openState.length) node.open = openState[i];
      });
      if (state.configFocus) {
        // 设置里的入口可以定位到任意分区；"feishu" 是历史别名，落到 channels
        const want = state.configFocus === "feishu"
          ? "channels" : state.configFocus;
        state.configFocus = "";
        const target = Array.from(pane.querySelectorAll(".cfg-section"))
          .find((node) => {
            const name = node.querySelector(".cfg-sec-head span");
            return name && name.textContent === want;
          });
        if (target) {
          target.open = true;
          setTimeout(() => {
            // 等 details 展开后再滚动，否则拿到的位置还是折叠态
            target.scrollIntoView({ block: "center" });
            if (want === "channels") {
              const input = $("#cfg-feishu-app-id");
              if (input) input.focus();
            }
          }, 0);
        }
      }
    } else {
      const area = el("textarea", "config-json");
      area.id = "cfg-json";
      area.spellcheck = false;
      area.value = JSON.stringify(state.config || {}, null, 2);
      pane.appendChild(area);
    }

    const issues = el("div");
    issues.id = "config-issues";
    body.appendChild(issues);

    const foot = el("div", "config-foot");
    const test = el("button");
    test.id = "config-test";
    test.textContent = "测试连接";
    test.onclick = configTest;
    const save = el("button", "primary");
    save.id = "config-save";
    save.textContent = "保存";
    save.onclick = configSave;
    const status = el("span", "setup-status");
    status.id = "config-status";
    foot.appendChild(test);
    foot.appendChild(save);
    foot.appendChild(status);
    body.appendChild(foot);
    body.scrollTop = scrollTop;
  }

  function switchConfigTab(tab) {
    if (tab === state.configTab) return;
    if (!commitConfigPane()) return;
    state.configTab = tab;
    renderConfigModal();
  }

  function commitConfigPane() {
    if (state.configTab === "json") {
      const area = $("#cfg-json");
      if (!area) return true;
      try {
        state.config = JSON.parse(area.value);
      } catch (err) {
        setConfigStatus("config", "JSON 解析失败：" + err.message, "err");
        return false;
      }
    }
    // 常用表单的控件已实时写回 state.config，无需再收集
    return true;
  }

  function configSave() {
    if (!commitConfigPane()) return;
    const save = $("#config-save");
    save.disabled = true;
    setConfigStatus("config", "保存中…", "");
    if (!send({ type: "config", op: "save", config: state.config })) {
      save.disabled = false;
      setConfigStatus("config", "未连接到后端", "err");
    }
  }

  function configTest() {
    if (!commitConfigPane()) return;
    const test = $("#config-test");
    test.disabled = true;
    setConfigStatus("config", "测试中…", "");
    if (!send({ type: "config", op: "test", config: state.config })) {
      test.disabled = false;
      setConfigStatus("config", "未连接到后端", "err");
    }
  }

  function onConfig(msg) {
    if (msg.op === "test") {
      handleTestResult(msg);
      return;
    }
    if (msg.saved === false) {
      $("#setup-save").disabled = false;
      $("#setup-test").disabled = false;
      const save = $("#config-save");
      if (save) save.disabled = false;
      const test = $("#config-test");
      if (test) test.disabled = false;
      renderConfigIssues(msg.issues || []);
      return;
    }
    if (msg.saved === true) {
      state.config = msg.config || state.config;
      state.configBaseline = JSON.stringify(state.config);
      if (msg.setup) state.setup = msg.setup;
      if (typeof msg.backup === "string") {
        // 重置只重建骨架（没有密钥），回到引导表单继续填写
        const path = state.setup ? state.setup.configPath : "";
        state.setup = { required: true, reason: "missing",
                        configPath: path, issues: [] };
        state.configTab = "form";
        openSetup(state.setup);
        return;
      }
      if (setupVisible()) {
        state.configSaved = true;
        $("#setup-save").disabled = true;
        $("#setup-test").disabled = true;
        setConfigStatus("setup", "配置已保存，正在重启…", "ok");
        beginRestart();
        return;
      }
      closeModal();
      showConfigBanner("配置已保存：重启应用后生效");
      toast("配置已保存，重启后生效", "info");
      return;
    }
    // read
    state.config = msg.config || {};
    state.configBaseline = JSON.stringify(state.config);
    if (msg.setup) state.setup = msg.setup;
    if (setupVisible()) renderSetupForm(state.config);
    else if (state.modalKind === "config") renderConfigModal();
  }

  function handleTestResult(msg) {
    $("#setup-test").disabled = false;
    const test = $("#config-test");
    if (test) test.disabled = false;
    const target = setupVisible() ? "setup" : "config";
    if (msg.ok) {
      setConfigStatus(target, `连接成功 · ${msg.latencyMs || 0} ms`, "ok");
      return;
    }
    setConfigStatus(target, msg.error || "连接失败", "err");
    if (msg.issues && msg.issues.length) renderConfigIssues(msg.issues);
  }

  function renderConfigIssues(issues) {
    if (!issues || !issues.length) return;
    if (setupVisible()) {
      const body = $("#setup-body");
      const old = $("#setup-issues");
      if (old) old.remove();
      const wrap = el("div");
      wrap.id = "setup-issues";
      wrap.appendChild(issueList(issues));
      body.insertBefore(wrap, body.firstChild);
      setConfigStatus("setup", "请修正配置后重试", "err");
      return;
    }
    const box = $("#config-issues");
    if (box) {
      box.innerHTML = "";
      box.appendChild(issueList(issues));
    }
    setConfigStatus("config", "请修正配置后重试", "err");
  }

  function setConfigStatus(target, text, cls) {
    const node = target === "setup" ? $("#setup-status") : $("#config-status");
    if (!node) return;
    node.textContent = text || "";
    node.className = "setup-status" + (cls ? " " + cls : "");
  }

  function showConfigBanner(text) {
    const banner = $("#config-banner");
    if (!banner) return;
    $("#config-banner-text").textContent = text;
    banner.classList.remove("hidden");
  }

  function restartUnavailable(reason) {
    $("#restarting").classList.add("hidden");
    const msg = reason
      ? `无法自动重启：${reason}。请手动关闭并重新启动 zero`
      : "配置已保存：请手动关闭并重新启动 zero";
    showConfigBanner(msg);
    if (setupVisible()) {
      setConfigStatus("setup", msg, "err");
    } else {
      toast(msg, "error");
    }
  }

  function beginRestart() {
    $("#restarting").classList.remove("hidden");
    const api = window.pywebview && window.pywebview.api;
    if (!api || !api.restart_app) {
      restartUnavailable("当前窗口不支持自动重启");
      return;
    }
    Promise.resolve(api.restart_app()).then((res) => {
      if (res === false) {
        restartUnavailable("");
      } else if (res && res.ok === false) {
        restartUnavailable(res.error || "未知原因");
      }
    }).catch((err) => {
      restartUnavailable(String((err && err.message) || err || "未知原因"));
    });
  }

  /* ================= toast ================= */

  function toast(text, level) {
    if (!text) return;
    const box = $("#toast");
    const item = el("div", "toast-item" + (level === "error" ? " error" : ""));
    item.innerHTML = icon(level === "error" ? "alert" : "spark") +
      `<span>${escapeHtml(text)}</span>`;
    box.appendChild(item);
    while (box.children.length > 3) box.firstElementChild.remove();
    setTimeout(() => {
      item.classList.add("leaving");
      setTimeout(() => item.remove(), 320);
    }, 3600);
  }

  /* ================= boot ================= */

  (async () => {
    autosize();
    sessionsSkeleton(5);
    historySkeleton();
    const info = await getBootstrap();
    if (!info) {
      hideSplash();
      $("#messages").innerHTML = emptyStateHtml();
      return;
    }
    connect(info);
    setTimeout(() => {
      if (!state.booted) {
        hideSplash();
        setConn("连接超时，仍在重试…", "off");
      }
    }, 12000);
  })();
})();
</script>
</body>
</html>
