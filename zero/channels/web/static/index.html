<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zero</title>
<style>
  /* ================= design tokens =================
     语义变量分两套取值：:root 为日间，html[data-theme="dark"] 覆盖为夜间。
     组件样式只引用变量，切换主题时只改变量取值。 */
  :root {
    color-scheme: light;

    /* 背景分层：页面 → 面板 → 浮层 → 悬停 */
    --bg:            #f5f7fa;
    --surface-1:     #ffffff;
    --surface-2:     #fbfcfe;
    --surface-3:     #edf1f6;
    --surface-sunken:#f3f5f9;

    /* 描边：弱分隔 / 常规 / 强调 */
    --line-weak:   rgba(15, 26, 41, .06);
    --line:        rgba(15, 26, 41, .11);
    --line-strong: rgba(15, 26, 41, .20);

    /* 文字三档 + 强调文本 */
    --text-1: #101a27;
    --text-2: #44536a;
    --text-3: #5f6d82;
    --text-strong: #060c14;

    /* 强调与状态（浅色需要更深才够对比） */
    --accent:       #0b7d56;
    --accent-hover: #0a6f4c;
    --accent-ink:   #ffffff;
    --accent-soft:  rgba(11, 125, 86, .09);
    --accent-soft-strong: rgba(11, 125, 86, .16);
    --accent-line:  rgba(11, 125, 86, .30);
    --accent-glow:  rgba(11, 125, 86, .16);
    --accent-glow-strong: rgba(11, 125, 86, .24);

    --info:      #1f5fbf;
    --info-soft: rgba(31, 95, 191, .08);
    --info-soft-strong: rgba(31, 95, 191, .15);
    --info-line: rgba(31, 95, 191, .26);

    --warn:      #8f6200;
    --warn-soft: rgba(143, 98, 0, .08);
    --warn-soft-strong: rgba(143, 98, 0, .14);
    --warn-line: rgba(143, 98, 0, .28);

    --danger:      #bf2f3d;
    --danger-soft: rgba(191, 47, 61, .07);
    --danger-soft-strong: rgba(191, 47, 61, .13);
    --danger-line: rgba(191, 47, 61, .28);
    --danger-ink:  #a0212e;

    /* 轻填充：悬停 / 徽标 / 键帽 */
    --hover:  rgba(15, 26, 41, .045);
    --fill-1: rgba(15, 26, 41, .05);
    --fill-2: rgba(15, 26, 41, .035);
    --fill-3: rgba(15, 26, 41, .08);

    /* 面板毛玻璃与浮层 */
    --glass-sidebar:  linear-gradient(180deg, rgba(255, 255, 255, .94), rgba(246, 248, 251, .96));
    --glass-topbar:   rgba(255, 255, 255, .72);
    --glass-composer: linear-gradient(180deg, rgba(245, 247, 250, .62), rgba(245, 247, 250, .95));
    --overlay:  rgba(22, 32, 46, .32);
    --toast-bg: rgba(255, 255, 255, .98);

    /* 装饰渐变（品牌 / 头像 / 气泡 / 空态 / 启动页） */
    --glow-a: rgba(11, 125, 86, .07);
    --glow-b: rgba(31, 95, 191, .05);
    --mark-bg: linear-gradient(150deg, #e6f6ef, #f4fbf8);
    --mark-highlight: inset 0 1px 0 rgba(255, 255, 255, .9);
    --avatar-bg: linear-gradient(160deg, #e8f6f0, #f6fbf9);
    --avatar-sub-bg: linear-gradient(160deg, #e8f0fe, #f5f8ff);
    --user-bubble-bg: linear-gradient(180deg, #e9f7f0, #e2f2ea);
    --user-bubble-text: #0e3327;
    --empty-mark-bg: linear-gradient(155deg, #e8f7f1, #f6fbf9);
    --empty-mark-glow: rgba(11, 125, 86, .13);
    --splash-bg: radial-gradient(620px 420px at 50% 38%, rgba(11, 125, 86, .10), transparent 72%);
    --splash-track: rgba(15, 26, 41, .08);

    /* 代码 / 引用 / 表格 / 审批摘要 */
    --quote-bg: rgba(11, 125, 86, .055);
    --inline-code-bg: rgba(15, 26, 41, .055);
    --inline-code-text: #0d6b4e;
    --code-text: #22303f;
    --code-head-bg: rgba(15, 26, 41, .035);
    --thead-bg: rgba(15, 26, 41, .035);
    --well-bg: rgba(15, 26, 41, .045);
    --approval-bg: linear-gradient(180deg, rgba(143, 98, 0, .055), rgba(143, 98, 0, .02));

    /* 滚动条 / 选中 / 焦点 / 骨架 */
    --scroll-thumb: rgba(15, 26, 41, .18);
    --scroll-thumb-hover: rgba(15, 26, 41, .30);
    --selection-bg: rgba(11, 125, 86, .17);
    --focus-line: rgba(11, 125, 86, .55);
    --focus-glow: rgba(11, 125, 86, .12);
    --sk-low:  rgba(15, 26, 41, .05);
    --sk-high: rgba(15, 26, 41, .10);

    /* 圆角阶梯 */
    --r-xs: 6px;
    --r-sm: 8px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 18px;
    --r-pill: 999px;

    /* 阴影：浅色分层主要靠灰面与描边，阴影只做浮层暗示 */
    --sh-1: 0 1px 2px rgba(15, 26, 41, .05);
    --sh-2: 0 8px 24px -14px rgba(15, 26, 41, .18);
    --sh-3: 0 26px 70px -26px rgba(15, 26, 41, .28);

    --ease: cubic-bezier(.22, .61, .36, 1);
    --dur: .22s;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
            "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Consolas,
            "Cascadia Code", monospace;

    --sidebar-w: 276px;
    --read-w: 780px;
  }

  /* ================= night theme ================= */
  html[data-theme="dark"] {
    color-scheme: dark;

    --bg:            #1c2128;
    --surface-1:     #232931;
    --surface-2:     #2b323b;
    --surface-3:     #353d48;
    --surface-sunken:#181d24;

    --line-weak:   rgba(255, 255, 255, .07);
    --line:        rgba(255, 255, 255, .12);
    --line-strong: rgba(255, 255, 255, .20);

    --text-1: #e6edf3;
    --text-2: #adb8c6;
    --text-3: #8b96a5;
    --text-strong: #f4f8fc;

    --accent:       #45d99f;
    --accent-hover: #63e9b4;
    --accent-ink:   #052018;
    --accent-soft:  rgba(69, 217, 159, .10);
    --accent-soft-strong: rgba(69, 217, 159, .16);
    --accent-line:  rgba(69, 217, 159, .26);
    --accent-glow:  rgba(69, 217, 159, .25);
    --accent-glow-strong: rgba(69, 217, 159, .34);

    --info:      #7aabff;
    --info-soft: rgba(122, 171, 255, .11);
    --info-soft-strong: rgba(122, 171, 255, .17);
    --info-line: rgba(122, 171, 255, .28);

    --warn:      #f0c46b;
    --warn-soft: rgba(240, 196, 107, .10);
    --warn-soft-strong: rgba(240, 196, 107, .18);
    --warn-line: rgba(240, 196, 107, .28);

    --danger:      #ff7d7d;
    --danger-soft: rgba(255, 125, 125, .10);
    --danger-soft-strong: rgba(255, 125, 125, .17);
    --danger-line: rgba(255, 125, 125, .30);
    --danger-ink:  #ffc0c0;

    --hover:  rgba(255, 255, 255, .05);
    --fill-1: rgba(255, 255, 255, .06);
    --fill-2: rgba(255, 255, 255, .035);
    --fill-3: rgba(255, 255, 255, .09);

    --glass-sidebar:  linear-gradient(180deg, rgba(32, 39, 48, .94), rgba(24, 30, 38, .96));
    --glass-topbar:   rgba(28, 33, 40, .72);
    --glass-composer: linear-gradient(180deg, rgba(28, 33, 40, .66), rgba(28, 33, 40, .94));
    --overlay:  rgba(9, 12, 16, .55);
    --toast-bg: rgba(45, 51, 59, .97);

    --glow-a: rgba(38, 74, 66, .22);
    --glow-b: rgba(30, 46, 78, .18);
    --mark-bg: linear-gradient(150deg, #26473c, #19241f);
    --mark-highlight: inset 0 1px 0 rgba(255, 255, 255, .08);
    --avatar-bg: linear-gradient(160deg, #233832, #19231f);
    --avatar-sub-bg: linear-gradient(160deg, #243044, #1b232e);
    --user-bubble-bg: linear-gradient(180deg, rgba(40, 64, 54, .82), rgba(29, 44, 38, .86));
    --user-bubble-text: #e4f3ec;
    --empty-mark-bg: linear-gradient(155deg, rgba(50, 88, 77, .60), rgba(22, 29, 26, .85));
    --empty-mark-glow: rgba(69, 217, 159, .35);
    --splash-bg: radial-gradient(620px 420px at 50% 38%, rgba(39, 73, 64, .28), transparent 72%);
    --splash-track: rgba(255, 255, 255, .10);

    --quote-bg: rgba(69, 217, 159, .055);
    --inline-code-bg: rgba(255, 255, 255, .07);
    --inline-code-text: #bfe6dd;
    --code-text: #cfe3f5;
    --code-head-bg: rgba(255, 255, 255, .04);
    --thead-bg: rgba(255, 255, 255, .04);
    --well-bg: rgba(0, 0, 0, .18);
    --approval-bg: linear-gradient(180deg, rgba(240, 196, 107, .08), rgba(240, 196, 107, .03));

    --scroll-thumb: rgba(255, 255, 255, .16);
    --scroll-thumb-hover: rgba(255, 255, 255, .26);
    --selection-bg: rgba(69, 217, 159, .24);
    --focus-line: rgba(69, 217, 159, .40);
    --focus-glow: rgba(69, 217, 159, .09);
    --sk-low:  rgba(255, 255, 255, .05);
    --sk-high: rgba(255, 255, 255, .10);

    --sh-1: 0 1px 2px rgba(0, 0, 0, .35);
    --sh-2: 0 10px 30px -14px rgba(0, 0, 0, .7);
    --sh-3: 0 30px 90px -26px rgba(0, 0, 0, .82);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-1);
    transition: background-color .2s var(--ease), color .2s var(--ease);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.7;
    letter-spacing: .012em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 520px at 82% -12%, var(--glow-a), transparent 70%),
      radial-gradient(700px 520px at 8% 108%, var(--glow-b), transparent 72%);
    z-index: 0;
  }
  button {
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 7px 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background var(--dur) var(--ease),
                border-color var(--dur) var(--ease),
                color var(--dur) var(--ease),
                opacity var(--dur) var(--ease),
                transform .12s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--surface-3); border-color: var(--line-strong); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 2px;
  }
  button:disabled { opacity: .42; cursor: not-allowed; }
  .icon { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: var(--r-pill);
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: var(--selection-bg); }

  /* ================= shell ================= */
  #app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    height: 100%;
  }
  #icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ================= sidebar ================= */
  #sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--line-weak);
    background: var(--glass-sidebar);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 18px 16px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 9px;
    display: grid; place-items: center;
    background: var(--mark-bg);
    border: 1px solid var(--accent-line);
    box-shadow: var(--mark-highlight);
    color: var(--accent);
  }
  .brand-mark .icon { width: 14px; height: 14px; stroke-width: 2; }
  .brand-sub {
    margin-left: auto;
    font: 500 10px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-3);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 4px 8px;
  }
  #new-session {
    margin: 0 12px 16px;
    justify-content: flex-start;
    padding: 9px 12px;
    border-style: dashed;
    border-color: var(--line);
    color: var(--text-2);
    background: var(--fill-2);
  }
  #new-session:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  #new-session .icon { width: 14px; height: 14px; }
  #new-session kbd { margin-left: auto; }

  .section-label {
    padding: 4px 20px 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label .count {
    font: 500 10px/1 var(--mono);
    letter-spacing: 0;
    color: var(--text-3);
    padding: 2px 6px;
    border-radius: var(--r-pill);
    background: var(--fill-1);
  }
  #sessions { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px; }
  .session {
    position: relative;
    padding: 9px 11px 9px 13px;
    border-radius: var(--r-md);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 2px;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .session::before {
    content: "";
    position: absolute;
    left: 4px; top: 50%;
    width: 2px; height: 0;
    border-radius: 2px;
    background: var(--accent);
    transform: translateY(-50%);
    transition: height var(--dur) var(--ease);
  }
  .session:hover { background: var(--hover); }
  .session.active {
    background: linear-gradient(90deg, var(--accent-soft), var(--fill-2));
    border-color: var(--line-weak);
  }
  .session.active::before { height: 18px; box-shadow: 0 0 10px var(--accent-line); }
  .session .t {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--dur) var(--ease);
  }
  .session.active .t { color: var(--text-1); }
  .session.unread .t { padding-right: 14px; }
  .session.unread::after {
    content: "";
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--danger);
  }
  .session .m {
    margin-top: 2px;
    font: 500 10.5px/1.5 var(--mono);
    color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-empty {
    padding: 10px 12px;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .sidebar-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-top: 1px solid var(--line-weak);
    font-size: 11.5px;
    color: var(--text-3);
  }
  .conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--warn);
    transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .conn-dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent-line); }
  .conn-dot.off { background: var(--danger); }
  .conn-dot.connecting { animation: pulse 1.4s ease-in-out infinite; }

  /* ================= skeleton ================= */
  .sk {
    border-radius: var(--r-xs);
    background: linear-gradient(90deg,
      var(--sk-low) 25%,
      var(--sk-high) 37%,
      var(--sk-low) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.5s ease infinite;
  }
  .sk-session { display: flex; flex-direction: column; gap: 7px; padding: 10px 11px; }
  .sk-session .sk:first-child { height: 11px; width: 72%; }
  .sk-session .sk:last-child { height: 9px; width: 44%; }
  .sk-row { display: flex; gap: 12px; margin: 0 auto 22px; max-width: var(--read-w); }
  .sk-row .sk:first-child { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px; }
  .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 3px; }
  .sk-lines .sk { height: 10px; }
  .sk-lines .sk:nth-child(2) { width: 88%; }
  .sk-lines .sk:nth-child(3) { width: 61%; }

  /* ================= splash ================= */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--splash-bg), var(--bg);
    transition: opacity .42s var(--ease);
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  .splash-mark {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: grid; place-items: center;
    color: var(--accent);
    background: var(--mark-bg);
    border: 1px solid var(--accent-line);
    box-shadow: 0 0 40px -8px var(--accent-glow);
    animation: breathe 2.4s ease-in-out infinite;
  }
  .splash-mark .icon { width: 24px; height: 24px; stroke-width: 1.8; }
  .splash-text { font-size: 12.5px; color: var(--text-3); letter-spacing: .04em; }
  .splash-bar {
    width: 132px; height: 2px;
    border-radius: 2px;
    overflow: hidden;
    background: var(--splash-track);
  }
  .splash-bar::after {
    content: "";
    display: block;
    width: 42%; height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.3s var(--ease) infinite;
  }

  /* ================= main ================= */
  #main {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  #topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 13px 26px;
    border-bottom: 1px solid var(--line-weak);
    background: var(--glass-topbar);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    transition: background-color .2s var(--ease);
    z-index: 3;
  }
  .title-block { min-width: 0; }
  #session-title {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .015em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #session-sub {
    margin-top: 1px;
    font: 500 10.5px/1.4 var(--mono);
    color: var(--text-3);
    letter-spacing: .02em;
    min-height: 14px;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .top-btn {
    padding: 6px 11px;
    font-size: 12.5px;
    color: var(--text-2);
    border-color: var(--line-weak);
    background: var(--fill-2);
  }
  .top-btn:hover:not(:disabled) { color: var(--text-1); }
  .top-btn .icon { width: 13px; height: 13px; }
  .theme-toggle { min-width: 76px; justify-content: center; }
  .theme-toggle:hover:not(:disabled) {
    color: var(--accent);
    border-color: var(--accent-line);
    background: var(--accent-soft);
  }

  /* ================= message stream ================= */
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 30px 32px 16px;
    overscroll-behavior: contain;
  }
  .msg {
    display: flex;
    gap: 13px;
    max-width: var(--read-w);
    margin: 0 auto 24px;
    animation: fade-up .3s var(--ease) both;
  }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 28px; height: 28px;
    flex: 0 0 28px;
    margin-top: 2px;
    border-radius: 9px;
    display: grid; place-items: center;
    font: 600 12px/1 var(--font);
    color: var(--accent);
    background: var(--avatar-bg);
    border: 1px solid var(--line);
  }
  .avatar .icon { width: 14px; height: 14px; stroke-width: 1.9; }
  .avatar.sub { color: var(--info); background: var(--avatar-sub-bg); }
  .bubble {
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .msg.assistant .bubble {
    flex: 1;
    padding-top: 2px;
    color: var(--text-1);
  }
  .msg.user .bubble {
    max-width: min(82%, 620px);
    padding: 10px 15px;
    border-radius: var(--r-lg);
    border: 1px solid var(--accent-line);
    background: var(--user-bubble-bg);
    color: var(--user-bubble-text);
    white-space: pre-wrap;
    box-shadow: var(--sh-1);
  }
  .compact-note {
    max-width: var(--read-w);
    margin: 0 auto 20px;
    padding: 8px 12px;
    border-left: 2px solid var(--line-strong);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-3);
  }
  .compact-note .lbl { color: var(--text-2); margin-right: 4px; }

  /* turn status indicator */
  .turn-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--text-3);
    animation: fade-in .2s var(--ease);
    transition: opacity var(--dur) var(--ease);
  }
  .turn-status[data-state="thinking"] { color: var(--accent); }
  .turn-status[data-state="streaming"] { color: var(--text-2); }
  .turn-status[data-state="tool"] { color: var(--info); }
  .turn-status[data-state="approval"] { color: var(--warn); }
  .turn-status[data-state="done"] { display: none; }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 6px;
  }
  .turn-status[data-state="thinking"] .status-dot,
  .turn-status[data-state="tool"] .status-dot,
  .turn-status[data-state="approval"] .status-dot {
    animation: pulse 1.3s ease-in-out infinite;
    box-shadow: 0 0 8px currentColor;
  }
  .parts { display: flex; flex-direction: column; gap: 2px; }
  .part-text + .part-text { margin-top: 10px; }

  /* markdown */
  .md { font-size: 14px; line-height: 1.78; color: var(--text-1); }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md.muted { color: var(--text-3); font-size: 13px; }
  .md p { margin: 10px 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 20px 0 9px;
    line-height: 1.42;
    letter-spacing: .01em;
    font-weight: 600;
  }
  .md h1 { font-size: 19px; }
  .md h2 { font-size: 16.5px; }
  .md h3 { font-size: 15px; }
  .md h4, .md h5, .md h6 { font-size: 14px; color: var(--text-2); }
  .md ul, .md ol { margin: 10px 0; padding-left: 22px; }
  .md li { margin: 4px 0; }
  .md li::marker { color: var(--text-3); }
  .md strong { font-weight: 600; color: var(--text-strong); }
  .md blockquote {
    margin: 12px 0;
    padding: 6px 14px;
    color: var(--text-2);
    border-left: 2px solid var(--accent-line);
    background: var(--quote-bg);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .md code {
    font: 12.5px/1.55 var(--mono);
    background: var(--inline-code-bg);
    border: 1px solid var(--line-weak);
    border-radius: var(--r-xs);
    padding: 1.5px 5px;
    color: var(--inline-code-text);
  }
  .codeblock {
    margin: 12px 0;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--surface-sunken);
  }
  .code-lang {
    padding: 5px 12px;
    font: 500 10.5px/1.6 var(--mono);
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-3);
    background: var(--code-head-bg);
    border-bottom: 1px solid var(--line-weak);
  }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
  .codeblock code {
    background: none; border: none; padding: 0;
    color: var(--code-text);
    font: 12.5px/1.65 var(--mono);
  }
  .table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: var(--r-md); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line-weak); padding: 7px 12px; text-align: left; }
  th {
    background: var(--thead-bg);
    font-weight: 600;
    color: var(--text-2);
    font-size: 12.5px;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  a { color: var(--info); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--dur) var(--ease); }
  a:hover { border-bottom-color: var(--info); }

  /* tool / reasoning / extras */
  .tool-chip {
    display: block;
    margin: 8px 0;
    padding: 8px 11px;
    font: 12px/1.65 var(--mono);
    color: var(--text-2);
    background: var(--fill-2);
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
    animation: fade-up .24s var(--ease) both;
  }
  .tool-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .tool-head::-webkit-details-marker { display: none; }
  .tool-chip .tool-ico {
    flex: 0 0 auto;
    width: 14px; height: 14px;
    color: var(--info);
  }
  .tool-chip.done .tool-ico { color: var(--text-3); }
  .tool-chip .tool-name { flex: 0 0 auto; color: var(--text-1); }
  .tool-preview {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--text-3);
  }
  .tool-caret {
    flex: 0 0 auto;
    width: 12px; height: 12px;
    margin-left: auto;
    color: var(--text-3);
    transition: transform var(--dur) var(--ease);
  }
  .tool-chip[open] .tool-caret { transform: rotate(90deg); }
  .tool-body {
    margin: 7px 0 0;
    padding: 8px 10px 0;
    border-top: 1px solid var(--line-weak);
    font: 12px/1.65 var(--mono);
    color: var(--text-2);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 240px;
    overflow-y: auto;
  }
  .run-group {
    margin: 8px 0;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
    background: var(--fill-2);
  }
  .run-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 11px;
    font: 12px/1.65 var(--mono);
    color: var(--text-2);
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .run-summary::-webkit-details-marker { display: none; }
  .run-summary .icon { flex: 0 0 auto; width: 13px; height: 13px; color: var(--text-3); }
  .run-caret { margin-left: auto; transition: transform var(--dur) var(--ease); }
  .run-group[open] .run-caret { transform: rotate(90deg); }
  .run-group-body {
    padding: 0 8px 4px;
    border-top: 1px solid var(--line-weak);
  }
  .run-group-body > .tool-chip,
  .run-group-body > .approval,
  .run-group-body > .reasoning { margin: 6px 0 0; }
  .reasoning {
    margin: 0 0 12px;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
    background: var(--fill-2);
    font-size: 12px;
    overflow: hidden;
    transition: border-color var(--dur) var(--ease);
  }
  .reasoning[open] { border-color: var(--line); }
  .reasoning summary {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    cursor: pointer;
    color: var(--text-3);
    list-style: none;
    user-select: none;
    transition: color var(--dur) var(--ease);
  }
  .reasoning summary::-webkit-details-marker { display: none; }
  .reasoning summary:hover { color: var(--text-2); }
  .reasoning summary .icon { width: 12px; height: 12px; transition: transform var(--dur) var(--ease); }
  .reasoning[open] summary .icon { transform: rotate(90deg); }
  .reasoning[open] pre { animation: fade-in .2s var(--ease); }
  .reasoning pre {
    margin: 0;
    padding: 2px 12px 10px;
    max-height: 220px;
    overflow: auto;
    white-space: pre-wrap;
    font: 12px/1.72 var(--mono);
    color: var(--text-3);
    border-top: 1px solid var(--line-weak);
    padding-top: 9px;
  }
  .marker {
    margin-top: 8px;
    font-size: 12px;
    color: var(--warn);
  }
  .marker.is-error { color: var(--danger); }
  .usage {
    margin-top: 8px;
    font: 500 10.5px/1.5 var(--mono);
    color: var(--text-3);
    letter-spacing: .02em;
  }

  /* approval */
  .approval {
    margin: 12px 0 4px;
    padding: 13px 14px;
    border-radius: var(--r-md);
    border: 1px solid var(--warn-line);
    background: var(--approval-bg);
    animation: fade-up .26s var(--ease) both;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .approval.ok { border-color: var(--accent-line); background: var(--accent-soft); }
  .approval.no { border-color: var(--danger-line); background: var(--danger-soft); }
  .approval-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--warn);
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .approval-head::-webkit-details-marker { display: none; }
  .approval-head .icon { width: 15px; height: 15px; }
  .approval-title {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .approval-tag {
    flex: 0 0 auto;
    font: 600 10.5px/1.4 var(--mono);
    letter-spacing: .04em;
    padding: 2px 7px;
    border-radius: var(--r-pill);
    background: var(--fill-2);
    color: var(--text-2);
  }
  .approval-caret {
    flex: 0 0 auto;
    width: 13px; height: 13px;
    margin-left: auto;
    color: var(--text-3);
    transition: transform var(--dur) var(--ease);
  }
  .approval[open] .approval-caret { transform: rotate(90deg); }
  .approval.ok .approval-head { color: var(--accent); }
  .approval.no .approval-head { color: var(--danger); }
  .approval-summary {
    margin: 9px 0 4px;
    padding: 9px 11px;
    border-radius: var(--r-sm);
    background: var(--well-bg);
    border: 1px solid var(--line-weak);
    font: 12.5px/1.7 var(--mono);
    color: var(--text-1);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .approval-detail { margin-top: 6px; font-size: 12px; color: var(--text-2); }
  .approval-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .approval-btn {
    padding: 6px 12px;
    font-size: 12.5px;
    border-color: var(--line);
    background: var(--fill-2);
  }
  .approval-btn:hover:not(:disabled) { border-color: var(--warn-line); background: var(--warn-soft-strong); }
  .approval-btn.primary {
    color: var(--accent);
    border-color: var(--accent-line);
    background: var(--accent-soft);
  }
  .approval-btn.primary:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft-strong);
  }
  .approval.ok .approval-btn, .approval.no .approval-btn { opacity: .5; }
  .approval-btn .key {
    display: inline-block;
    padding: 1px 5px;
    margin-right: 2px;
    border-radius: var(--r-xs);
    background: var(--fill-3);
    color: var(--text-2);
    font: 600 11px/1.5 var(--mono);
  }
  .approval-foot { margin-top: 9px; font-size: 11px; color: var(--text-3); }
  .approval.history { animation: none; }
  .approval-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .approval-choice {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    font-size: 12px;
    color: var(--text-3);
  }
  .approval-choice.chosen {
    color: var(--text-1);
    border-color: var(--line-strong);
    background: var(--fill-2);
  }
  .approval-choice .key {
    display: inline-block;
    padding: 1px 5px;
    border-radius: var(--r-xs);
    background: var(--fill-3);
    color: var(--text-2);
    font: 600 11px/1.5 var(--mono);
  }

  /* subagent */
  .subagent {
    margin: 6px 0;
    padding: 11px 13px;
    border-radius: var(--r-md);
    border: 1px solid var(--info-line);
    background: var(--info-soft);
  }
  .subagent .lbl {
    display: flex;
    align-items: center;
    gap: 6px;
    font: 600 10.5px/1.5 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--info);
    margin-bottom: 6px;
  }

  /* empty state */
  #empty {
    max-width: 560px;
    min-height: calc(100% - 32px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: fade-up .45s var(--ease) both;
  }
  #empty .empty-mark {
    width: 52px; height: 52px;
    margin: 0 auto 20px;
    border-radius: 16px;
    display: grid; place-items: center;
    color: var(--accent);
    background: var(--empty-mark-bg);
    border: 1px solid var(--accent-line);
    box-shadow: 0 0 46px -12px var(--empty-mark-glow);
  }
  #empty .empty-mark .icon { width: 25px; height: 25px; stroke-width: 1.7; }
  #empty h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--text-1);
  }
  #empty .sub { font-size: 13px; color: var(--text-3); }
  #empty .keys {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    font-size: 11.5px;
    color: var(--text-3);
  }
  #empty .key-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-pill);
    background: var(--fill-2);
  }
  kbd {
    font: 600 10.5px/1.4 var(--mono);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: var(--r-xs);
    padding: 1px 5px;
    background: var(--surface-2);
    color: var(--text-2);
  }

  /* ================= composer ================= */
  #composer {
    flex: 0 0 auto;
    display: flex;
    gap: 9px;
    align-items: flex-end;
    padding: 14px 32px 20px;
    border-top: 1px solid var(--line-weak);
    background: var(--glass-composer);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    transition: background-color .2s var(--ease);
    z-index: 2;
  }
  .composer-inner {
    flex: 1;
    max-width: var(--read-w);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 12px 14px 8px;
    border-radius: var(--r-xl);
    border: 1px solid var(--line);
    background: var(--surface-1);
    box-shadow: var(--sh-1);
    transition: border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease),
                background-color .2s var(--ease);
  }
  .composer-inner:focus-within {
    border-color: var(--focus-line);
    box-shadow: 0 0 0 3px var(--focus-glow), var(--sh-1);
  }
  #input {
    flex: none;
    width: 100%;
    resize: none;
    min-height: 52px;
    max-height: 200px;
    padding: 0 2px 4px;
    border: none;
    background: transparent;
    color: var(--text-1);
    font: inherit;
    line-height: 1.6;
    outline: none;
  }
  #input::placeholder { color: var(--text-3); }
  .composer-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 34px;
  }
  .composer-spacer { flex: 1; min-width: 8px; }
  .ghost-select {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    max-width: 240px;
    height: 32px;
    padding: 0 6px;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    white-space: nowrap;
  }
  .ghost-select:hover:not(:disabled) {
    background: var(--hover);
    color: var(--text-1);
  }
  .ghost-select .icon {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--text-3);
  }
  .ghost-select .chevron { width: 12px; height: 12px; opacity: .75; }
  .ghost-select span { overflow: hidden; text-overflow: ellipsis; }
  #cwd-btn.unset { color: var(--text-3); }
  #model-btn { max-width: 220px; }
  .cwd-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line-weak);
  }
  .cwd-actions .spacer { flex: 1; }
  .cwd-status { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--danger); }
  #send, #stop {
    flex: 0 0 auto;
    justify-content: center;
    border-radius: var(--r-md);
  }
  #send {
    width: 34px;
    height: 34px;
    min-width: 34px;
    padding: 0;
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
  }
  #send:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  #send:disabled {
    background: var(--surface-3);
    border-color: transparent;
    color: var(--text-3);
    opacity: 1;
  }
  #send .icon { width: 16px; height: 16px; stroke-width: 2.1; }
  #stop {
    height: 32px;
    padding: 0 10px;
    color: var(--danger);
    border-color: var(--danger-line);
    background: var(--danger-soft);
    font-size: 12px;
    animation: fade-in .18s var(--ease);
  }
  #stop:hover:not(:disabled) { background: var(--danger-soft-strong); }

  /* jump to latest */
  #jump {
    position: absolute;
    right: 34px;
    bottom: 156px;
    z-index: 4;
    width: 34px; height: 34px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
    color: var(--text-2);
    background: var(--surface-2);
    border-color: var(--line);
    box-shadow: var(--sh-2);
    opacity: 0;
    transform: translateY(6px) scale(.92);
    pointer-events: none;
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  #jump.show { opacity: 1; transform: none; pointer-events: auto; }
  #jump:hover:not(:disabled) { color: var(--text-1); }
  #jump .icon { width: 15px; height: 15px; }

  /* ================= modal ================= */
  #modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--overlay);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    animation: fade-in .18s var(--ease);
  }
  .modal-box {
    width: min(600px, 100%);
    max-height: 74vh;
    display: flex;
    flex-direction: column;
    border-radius: var(--r-lg);
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface-2), var(--surface-1));
    box-shadow: var(--sh-3);
    animation: scale-in .22s var(--ease);
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-weak);
    font-size: 14px;
    font-weight: 600;
  }
  .modal-head-actions { display: flex; align-items: center; gap: 8px; }
  .modal-head button { padding: 5px 10px; font-size: 12px; color: var(--text-2); border-color: var(--line-weak); }
  .modal-head button .icon { width: 13px; height: 13px; }
  .modal-body { padding: 14px 18px 18px; overflow-y: auto; }
  .modal-note { font-size: 12px; color: var(--text-3); }
  .model-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
    font-size: 13px;
    cursor: pointer;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .model-item:hover { background: var(--hover); border-color: var(--line); }
  .model-item.active { border-color: var(--accent-line); background: var(--accent-soft); }
  .model-item .cur {
    font: 600 10px/1.4 var(--mono);
    letter-spacing: .06em;
    color: var(--accent);
  }
  .task-item {
    padding: 11px 2px;
    border-bottom: 1px solid var(--line-weak);
  }
  .task-item:last-child { border-bottom: none; }
  .task-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-status {
    font: 600 10px/1.5 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    color: var(--text-2);
  }
  .task-status.s-running { color: var(--info); border-color: var(--info-line); background: var(--info-soft); }
  .task-status.s-completed { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .task-status.s-failed { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
  .task-status.s-pending { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
  .task-status.s-cancelled { color: var(--text-3); border-color: var(--line); }
  .task-meta { font: 500 10.5px/1.5 var(--mono); color: var(--text-3); }
  .task-text { margin-top: 5px; font-size: 13px; line-height: 1.65; color: var(--text-2); overflow-wrap: anywhere; }
  .modal-body.tasks-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .tasks-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line-weak);
  }
  .seg {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    background: var(--fill-2);
  }
  .seg-btn {
    border: none;
    border-radius: var(--r-pill);
    padding: 4px 11px;
    font-size: 12px;
    color: var(--text-2);
  }
  .seg-btn.active { background: var(--surface-1); color: var(--text-1); box-shadow: var(--sh-1); }
  .tasks-count { font: 500 10.5px/1.4 var(--mono); color: var(--text-3); }
  .tasks-list { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .tasks-pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-top: 12px;
    margin-top: 6px;
    border-top: 1px solid var(--line-weak);
  }
  .tasks-pager span { font: 500 11px/1 var(--mono); color: var(--text-3); }
  .tasks-pager button { padding: 4px 10px; font-size: 12px; }
  .skill-item {
    margin: 8px 0;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
    background: var(--fill-2);
  }
  .skill-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .skill-head::-webkit-details-marker { display: none; }
  .skill-name {
    flex: 0 0 auto;
    font: 600 12.5px/1.5 var(--mono);
    color: var(--text-1);
  }
  .skill-desc {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
    color: var(--text-3);
  }
  .skill-caret {
    flex: 0 0 auto;
    width: 13px; height: 13px;
    color: var(--text-3);
    transition: transform var(--dur) var(--ease);
  }
  .skill-item[open] .skill-caret { transform: rotate(90deg); }
  .skill-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 12px 2px;
  }
  .skill-meta-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .skill-meta-key {
    flex: 0 0 auto;
    width: 68px;
    font: 500 10.5px/1.6 var(--mono);
    color: var(--text-3);
  }
  .skill-meta-val {
    flex: 1;
    min-width: 0;
    font: 11.5px/1.68 var(--mono);
    color: var(--text-2);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .skill-body {
    margin: 8px 12px 12px;
    padding: 12px 14px;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-xs);
    background: var(--surface-sunken);
    font-size: 13px;
    line-height: 1.72;
    max-height: 360px;
    overflow-y: auto;
  }
  .modal-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 26px 0 18px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .modal-state .icon { width: 20px; height: 20px; color: var(--text-3); }

  /* ================= toast ================= */
  #toast {
    position: fixed;
    /* 相对主对话区（排除侧栏）居中，而不是整个窗口 */
    left: calc(var(--sidebar-w) + (100% - var(--sidebar-w)) / 2);
    bottom: 96px;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .toast-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    background: var(--toast-bg);
    box-shadow: var(--sh-2);
    color: var(--text-1);
    font-size: 12.5px;
    animation: toast-in .24s var(--ease);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .toast-item .icon { width: 14px; height: 14px; color: var(--text-3); }
  .toast-item.error { border-color: var(--danger-line); color: var(--danger-ink); }
  .toast-item.error .icon { color: var(--danger); }
  .toast-item.leaving { opacity: 0; transform: translateY(6px); }

  /* ================= config / setup ================= */
  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: var(--accent-ink);
  }
  #config-banner {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    font-size: 12.5px;
    color: var(--warn);
    background: var(--warn-soft);
    border-bottom: 1px solid var(--warn-line);
  }
  #config-banner .icon { width: 14px; height: 14px; flex: 0 0 auto; }
  #config-banner span { flex: 1; min-width: 0; }
  #config-banner button { padding: 4px 10px; font-size: 12px; }
  #setup {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    background-image:
      radial-gradient(720px 480px at 50% 6%, var(--glow-a), transparent 70%),
      radial-gradient(620px 420px at 8% 100%, var(--glow-b), transparent 72%);
  }
  .setup-card {
    width: min(560px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px 26px 20px;
    border-radius: var(--r-xl);
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface-2), var(--surface-1));
    box-shadow: var(--sh-3);
    animation: scale-in .24s var(--ease);
  }
  .setup-title { font-size: 17px; font-weight: 600; color: var(--text-strong); }
  .setup-sub { margin-top: 5px; font-size: 12.5px; color: var(--text-3); }
  .setup-body { margin-top: 18px; }
  .form-grid { display: flex; flex-direction: column; gap: 12px; }
  .form-row label {
    display: block;
    margin-bottom: 5px;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .form-input {
    width: 100%;
    min-height: 36px;
    padding: 8px 10px;
    font: 13px/1.5 var(--font);
    color: var(--text-1);
    background: var(--surface-1);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    outline: none;
    transition: border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
  }
  .form-input:focus {
    border-color: var(--accent-line);
    box-shadow: 0 0 0 3px var(--focus-glow);
  }
  /* 单行控件统一 36px 高：input 与 select 的原生内边距不同，不固定会出现
     同一行里高度参差、标签错位 */
  input.form-input, select.form-input {
    height: 36px;
    padding-top: 0;
    padding-bottom: 0;
  }
  .form-hint { margin-top: 4px; font-size: 11px; color: var(--text-3); }
  .form-split { display: flex; gap: 12px; }
  .form-split > .form-row { flex: 1; min-width: 0; }
  .setup-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line-weak);
  }
  .setup-status { flex: 1; min-width: 0; font-size: 12px; color: var(--text-3); }
  .setup-status.ok { color: var(--accent); }
  .setup-status.err { color: var(--danger); }
  .setup-path {
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-3);
    overflow-wrap: anywhere;
  }
  .setup-path code { font: 11px/1.5 var(--mono); color: var(--text-2); }
  .issue-list { margin: 0 0 12px; padding: 0; list-style: none; }
  .issue-list li {
    margin-top: 6px;
    padding: 7px 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--danger-ink);
    background: var(--danger-soft);
    border: 1px solid var(--danger-line);
    border-radius: var(--r-sm);
    overflow-wrap: anywhere;
  }
  .issue-list code { margin-right: 6px; font: 11px/1.4 var(--mono); opacity: .8; }
  .config-tabs { margin-bottom: 12px; }
  .config-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line-weak);
  }
  .config-foot .setup-status { font-size: 12px; }
  .config-json {
    width: 100%;
    min-height: 300px;
    resize: vertical;
    padding: 10px 12px;
    font: 12px/1.65 var(--mono);
    color: var(--code-text);
    background: var(--surface-sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    outline: none;
  }
  .config-json:focus { border-color: var(--accent-line); }

  /* schema 驱动的配置表单 */
  .cfg-legend { margin-bottom: 10px; font-size: 11.5px; line-height: 1.7; color: var(--text-3); }
  .cfg-req { margin-left: 3px; color: var(--danger); font-weight: 700; }
  .cfg-section {
    margin-bottom: 10px;
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
    background: var(--fill-2);
  }
  .cfg-sec-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    list-style: none;
    cursor: pointer;
    user-select: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-1);
  }
  .cfg-sec-head::-webkit-details-marker { display: none; }
  .cfg-sec-desc {
    flex: 1;
    min-width: 0;
    font-weight: 400;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .cfg-sec-caret {
    flex: 0 0 auto;
    width: 13px; height: 13px;
    color: var(--text-3);
    transition: transform var(--dur) var(--ease);
  }
  .cfg-section[open] .cfg-sec-caret { transform: rotate(90deg); }
  .cfg-sec-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 2px 12px 12px;
  }
  .cfg-sub {
    padding-top: 10px;
    border-top: 1px dashed var(--line-weak);
  }
  .cfg-sub:first-child { padding-top: 0; border-top: none; }
  .cfg-sub-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cfg-sub-title { flex: 1; min-width: 0; font: 600 12px/1.6 var(--mono); color: var(--text-2); }
  /* 映射行（models）：顶部对齐，避免带说明的列把相邻列的标签顶歪 */
  .cfg-map-row { display: flex; align-items: flex-start; gap: 8px; }
  .cfg-map-row > .form-row { flex: 1; min-width: 0; }
  .cfg-map-row .form-row > label { line-height: 20px; }
  /* 与输入框对齐：label 行高 20px + 下边距 5px */
  .cfg-map-row > .cfg-del { margin-top: 25px; }

  /* providers：每个厂商一张卡片，字段统一“标签在上、控件在下” */
  .cfg-provider { display: flex; flex-direction: column; gap: 10px; }
  .cfg-provider + .cfg-provider {
    margin-top: 2px;
    padding-top: 12px;
    border-top: 1px dashed var(--line-weak);
  }
  .cfg-del {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    padding: 0 10px;
    font-size: 12px;
    color: var(--danger);
    border-color: var(--danger-line);
  }
  .cfg-add {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    min-height: 36px;
    padding: 0 12px;
    font-size: 12px;
  }
  .cfg-check { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
  .cfg-check input { accent-color: var(--accent); }
  .cfg-note { font-size: 11.5px; line-height: 1.7; color: var(--text-3); }
  .cfg-json-field { min-height: 62px; resize: vertical; font: 11.5px/1.6 var(--mono); }
  .cfg-json-field.bad { border-color: var(--danger); }
  .cfg-inline { display: flex; align-items: stretch; gap: 6px; }
  .cfg-inline .form-input { flex: 1; min-width: 0; }
  .setup-foot button, .config-foot button { min-height: 36px; }

  /* 权限设置 */
  .perm-status { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .perm-status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-2);
    background: var(--fill-2);
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
  }
  .perm-key { color: var(--text-3); }
  .perm-badge {
    padding: 1px 9px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--surface-1);
    border: 1px solid var(--line-weak);
    border-radius: 999px;
  }
  .perm-badge.ok {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: var(--accent-line);
  }
  .perm-badge.bad {
    color: var(--danger);
    background: var(--danger-soft);
    border-color: var(--danger-line);
  }
  .perm-hint {
    flex: 1 0 100%;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-3);
    overflow-wrap: anywhere;
  }
  .perm-warn {
    margin-bottom: 12px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--danger-ink);
    background: var(--danger-soft);
    border: 1px solid var(--danger-line);
    border-radius: var(--r-sm);
  }
  .perm-error {
    margin-bottom: 12px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--danger-ink);
    background: var(--danger-soft);
    border: 1px solid var(--danger-line);
    border-radius: var(--r-sm);
  }
  .perm-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 12px;
    background: var(--surface-1);
    border: 1px solid var(--line-weak);
    border-radius: var(--r-sm);
  }
  .perm-path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 11.5px/1.6 var(--mono);
    color: var(--text-2);
  }
  .perm-del {
    flex: 0 0 auto;
    min-height: 28px;
    padding: 0 9px;
    font-size: 11.5px;
    color: var(--danger);
    border-color: var(--danger-line);
  }
  .perm-empty { padding: 6px 2px; font-size: 11.5px; color: var(--text-3); }
  .perm-add { display: flex; align-items: stretch; gap: 6px; }
  .perm-add .form-input { flex: 1; min-width: 0; }
  .perm-add button { flex: 0 0 auto; min-height: 36px; }

  #restarting {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .restart-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--text-2);
  }

  /* ================= animation ================= */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scale-in {
    from { opacity: 0; transform: translateY(6px) scale(.985); }
    to { opacity: 1; transform: none; }
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .38; }
  }
  @keyframes shimmer {
    from { background-position: 100% 50%; }
    to { background-position: 0 50%; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 36px -10px var(--accent-glow); }
    50% { transform: scale(1.04); box-shadow: 0 0 52px -8px var(--accent-glow-strong); }
  }
  @keyframes slide {
    from { transform: translateX(-110%); }
    to { transform: translateX(340%); }
  }
  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dots i {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: currentColor;
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot-bounce {
    0%, 60%, 100% { opacity: .28; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  @media (max-width: 900px) {
    :root { --sidebar-w: 232px; }
    #messages { padding: 22px 20px 12px; }
    #composer { padding: 12px 20px 16px; }
    #cwd-btn { max-width: 150px; }
    #model-btn { max-width: 160px; }
    #topbar { padding: 11px 20px; }
    #jump { right: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .splash-mark { animation: none !important; }
  }
</style>
</head>

  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.4l-1.9-5.6L4.5 10.9 10.1 9 12 3.5Z"/></symbol>
